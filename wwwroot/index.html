<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fitness Pro</title>
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text x=%2250%25%22 y=%2250%25%22 dominant-baseline=%22central%22 text-anchor=%22middle%22 font-size=%2280%22>🍏</text></svg>">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #0f172a;
            --glass-bg: rgba(30, 41, 59, 0.85);
            --glass-border: rgba(255, 255, 255, 0.1);
            --color-1: #f472b6; /* ורוד */
            --color-2: #c084fc; /* סגול */
            --color-3: #fbbf24; /* זהב */
            --color-4: #4ade80; /* ירוק תפוח */
        }

        body {
            font-family: 'Assistant', sans-serif;
            background-color: var(--bg-dark);
            color: #f8fafc;
            margin: 0; min-height: 100vh;
            display: flex; flex-direction: column;
            overflow-x: hidden;
        }

        .glow-text {
            font-weight: 900;
            background: linear-gradient(to right, var(--color-1), var(--color-2), var(--color-3));
            -webkit-background-clip: text; background-clip: text; color: transparent;
            text-shadow: 0 0 30px rgba(244, 114, 182, 0.4);
        }

        .app-header {
            padding: 15px 20px; display: flex; justify-content: space-between; align-items: center;
            background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(10px);
            position: sticky; top: 0; z-index: 10; border-bottom: 1px solid var(--glass-border);
        }

        .progress-container {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 50px 0; position: relative;
        }
        
        .cal-number { 
            font-size: 5.5rem; font-weight: 900; line-height: 1;
            background: linear-gradient(to bottom, #ffffff, #e2e8f0);
            -webkit-background-clip: text; background-clip: text; color: transparent;
            margin-bottom: 5px;
        }

        /* === גריד הריבועים המוגדל === */
        .meals-grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 20px; 
            padding: 0 25px 120px; 
            max-width: 600px; /* הגדלתי את הרוחב המקסימלי */
            margin: 0 auto; 
            width: 100%;
        }
        
        .meal-card {
            background: var(--glass-bg); 
            border: 1px solid var(--glass-border);
            border-radius: 28px; /* פינות יותר עגולות ורכות */
            padding: 30px 20px; /* יותר מרחב פנימי */
            backdrop-filter: blur(10px);
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            text-align: center;
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            min-height: 180px; /* גובה מינימלי כדי שלא ייראו קטנים */
            justify-content: center;
        }

        .meal-card:active { transform: scale(0.92); }

        .card-icon { font-size: 2.8rem; margin-bottom: 12px; } /* אייקון גדול יותר */
        .card-title { font-weight: 800; font-size: 1.2rem; margin-bottom: 8px; color: #f1f5f9; }
        .card-cal { font-size: 1.8rem; font-weight: 900; color: white; text-shadow: 0 0 15px rgba(255,255,255,0.2); }
        .card-sub { font-size: 0.9rem; color: #94a3b8; margin-top: 4px; }

        /* צבעים לקוביות */
        .border-morning { border-top: 5px solid var(--color-3); box-shadow: 0 10px 30px rgba(251, 191, 36, 0.05); }
        .border-noon { border-top: 5px solid var(--color-1); box-shadow: 0 10px 30px rgba(244, 114, 182, 0.05); }
        .border-evening { border-top: 5px solid var(--color-2); box-shadow: 0 10px 30px rgba(192, 132, 252, 0.05); }
        .border-snack { border-top: 5px solid var(--color-4); box-shadow: 0 10px 30px rgba(74, 222, 128, 0.05); }

        .fab {
            position: fixed; bottom: 35px; left: 35px;
            width: 75px; height: 75px; border-radius: 50%;
            background: linear-gradient(135deg, var(--color-1), var(--color-2));
            color: white; display: flex; align-items: center; justify-content: center;
            font-size: 2.5rem; box-shadow: 0 10px 30px rgba(192, 132, 252, 0.5); 
            cursor: pointer; z-index: 100; transition: 0.3s;
        }

        /* מודאלים ושאר הפונקציות נשמרים כפי שהיו */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 200; display: none;
            align-items: center; justify-content: center; backdrop-filter: blur(8px);
        }
        .modal-box {
            background: #1e293b; width: 90%; max-width: 400px; padding: 25px;
            border-radius: 24px; border: 1px solid var(--glass-border);
        }
        .input-glass { background: var(--glass-bg); border: 1px solid var(--glass-border); color: white; border-radius: 15px; padding: 15px; width: 100%; margin-bottom: 15px; }
        .btn-glow { background: linear-gradient(135deg, var(--color-1), var(--color-2)); color: white; font-weight: 800; padding: 15px; border-radius: 15px; border: none; width: 100%; }
        .hidden { display: none !important; }
        .password-wrapper { position: relative; width: 100%; }
        .password-wrapper input { padding-right: 45px !important; direction: ltr; }
        .password-toggle { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: #94a3b8; cursor: pointer; z-index: 10; }
    </style>
</head>
<body>

<div id="loginScreen" class="p-4" style="max-width: 400px; margin: 80px auto;">
    <h1 class="glow-text" style="font-size: 3.5rem; line-height: 1.2;">Fitness<br>Pro</h1>
    <p class="text-secondary mb-4">האנרגיה שלך מתחילה כאן.</p>
    <input type="email" id="loginEmail" class="input-glass" placeholder="אימייל" dir="ltr">
    <div class="password-wrapper">
        <input type="password" id="loginPass" class="input-glass" placeholder="סיסמה" dir="ltr">
        <i class="bi bi-eye password-toggle" onclick="togglePass('loginPass', this)"></i>
    </div>
    <button onclick="login()" class="btn-glow mt-2">כניסה למערכת</button>
</div>

<div id="appScreen" class="hidden">
    <div class="app-header">
        <div class="glow-text" style="font-size: 1.5rem;">My Tracker</div>
        <button onclick="logout()" class="btn btn-outline-light btn-sm rounded-pill px-3">יציאה</button>
    </div>

    <div class="progress-container">
        <div class="cal-number" id="totalCalories">0</div>
        <div style="color: var(--color-2); font-weight: 800; letter-spacing: 2px; text-transform: uppercase;">קלוריות היום</div>
    </div>

    <div class="meals-grid" id="mealsGrid"></div>

    <div class="fab" onclick="openAddModal()"><i class="bi bi-plus-lg"></i></div>
</div>

<div class="modal-overlay" id="addModal">
    <div class="modal-box">
        <h4 class="text-white fw-bold mb-4">הוספת ארוחה</h4>
        <select id="mealType" class="input-glass">
            <option value="morning">🥐 בוקר</option>
            <option value="noon">🍛 צהריים</option>
            <option value="evening">🥗 ערב</option>
            <option value="snack">🥨 נשנוש</option>
        </select>
        <input type="text" id="foodName" class="input-glass" placeholder="מה אכלת?">
        <input type="number" id="foodCal" class="input-glass" placeholder="כמה קלוריות?">
        <button onclick="addMeal()" class="btn-glow">שמירה</button>
        <button onclick="closeModal('addModal')" class="btn btn-link text-secondary w-100 mt-2">ביטול</button>
    </div>
</div>

<script>
    const API_URL = '/api';
    let currentUser = null;

    function togglePass(inputId, icon) {
        const input = document.getElementById(inputId);
        input.type = input.type === 'password' ? 'text' : 'password';
        icon.classList.toggle('bi-eye');
        icon.classList.toggle('bi-eye-slash');
    }

    function init() {
        const saved = localStorage.getItem('dietUser');
        if (saved) {
            currentUser = JSON.parse(saved);
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('appScreen').classList.remove('hidden');
            loadData();
        }
    }

    async function login() {
        const email = document.getElementById('loginEmail').value;
        const pass = document.getElementById('loginPass').value;
        const res = await fetch(`${API_URL}/auth/login`, {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ email, password: pass })
        });
        if (res.ok) {
            const data = await res.json();
            currentUser = { id: data.userId, email: data.email };
            localStorage.setItem('dietUser', JSON.stringify(currentUser));
            location.reload();
        }
    }

    function logout() { localStorage.removeItem('dietUser'); location.reload(); }

    async function loadData() {
        const res = await fetch(`${API_URL}/meals?userId=${currentUser.id}`);
        const allMeals = await res.json();
        renderGrid(allMeals);
    }

    function renderGrid(meals) {
        const todayStr = new Date().toDateString();
        const todaysMeals = meals.filter(m => new Date(m.date).toDateString() === todayStr);
        document.getElementById('totalCalories').innerText = todaysMeals.reduce((s, m) => s + m.calories, 0);

        const cats = {
            morning: { t: 'בוקר', i: '🥐', b: 'border-morning', cal: 0, items: 0 },
            noon: { t: 'צהריים', i: '🍛', b: 'border-noon', cal: 0, items: 0 },
            evening: { t: 'ערב', i: '🥗', b: 'border-evening', cal: 0, items: 0 },
            snack: { t: 'נשנוש', i: '🥨', b: 'border-snack', cal: 0, items: 0 }
        };

        todaysMeals.forEach(m => {
            const h = new Date(m.date).getHours();
            let k = 'snack';
            if (h >= 5 && h < 12) k = 'morning';
            else if (h >= 12 && h < 17) k = 'noon';
            else if (h >= 17 && h < 22) k = 'evening';
            cats[k].cal += m.calories;
            cats[k].items++;
        });

        const grid = document.getElementById('mealsGrid');
        grid.innerHTML = '';
        Object.keys(cats).forEach(key => {
            const c = cats[key];
            grid.innerHTML += `
                <div class="meal-card ${c.b}">
                    <div class="card-icon">${c.i}</div>
                    <div class="card-title">${c.t}</div>
                    <div class="card-cal">${c.cal}</div>
                    <div class="card-sub">${c.items} פריטים</div>
                </div>`;
        });
    }

    function openAddModal() { document.getElementById('addModal').style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    async function addMeal() {
        const type = document.getElementById('mealType').value;
        const name = document.getElementById('foodName').value;
        const cal = document.getElementById('foodCal').value;
        let d = new Date();
        if(type==='morning') d.setHours(9); else if(type==='noon') d.setHours(14); else if(type==='evening') d.setHours(20);

        await fetch(`${API_URL}/meals`, {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ name, calories: parseInt(cal), userId: currentUser.id, date: d.toISOString() })
        });
        closeModal('addModal');
        loadData();
    }

    init();
</script>
</body>
</html>
