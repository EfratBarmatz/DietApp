<html dir="rtl" lang="he">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Diet App</title>

    <style>
        :root {
            --bg-dark: #0f172a; /* כחול לילה עמוק */
            --bg-card: #1e293b;
            --primary: #22c55e; /* ירוק ניאון */
            --primary-glow: rgba(34, 197, 94, 0.5);
            --accent: #8b5cf6; /* סגול ניאון */
            --text-light: #f8fafc;
            --text-gray: #94a3b8;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            margin: 0; min-height: 100vh;
            display: flex; flex-direction: column;
        }

        /* --- כניסה והרשמה --- */
        .auth-container {
            flex: 1; display: flex; flex-direction: column; justify-content: center;
            padding: 30px; max-width: 400px; margin: 0 auto; width: 100%;
        }
        
        /* כותרת ניאון יציבה */
        h1 { 
            font-weight: 800; font-size: 2.5rem; margin-bottom: 5px; 
            color: var(--primary); 
            text-shadow: 0 0 15px rgba(34, 197, 94, 0.4); /* אפקט זוהר */
        }
        .subtitle { color: var(--text-gray); font-size: 1.1rem; margin-bottom: 40px; }

        .input-dark {
            background: var(--bg-card);
            border: 1px solid #334155; color: white;
            border-radius: 12px; padding: 15px; font-size: 1rem; width: 100%;
            margin-bottom: 15px; transition: 0.3s;
        }
        .input-dark:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 15px var(--primary-glow); }
        .input-dark::placeholder { color: #475569; }

        .btn-neon {
            background: var(--primary); color: #000; font-weight: 800; padding: 15px;
            border-radius: 12px; border: none; width: 100%; font-size: 1.1rem; cursor: pointer;
            box-shadow: 0 0 20px var(--primary-glow); margin-top: 10px;
        }
        .btn-neon:hover { background: #4ade80; box-shadow: 0 0 30px var(--primary-glow); transform: scale(1.02); }

        .link-text { color: var(--accent); cursor: pointer; text-decoration: underline; font-weight: bold; }

        /* --- דשבורד --- */
        .app-header {
            padding: 15px 20px; display: flex; justify-content: space-between; align-items: center;
            background: rgba(15, 23, 42, 0.95); border-bottom: 1px solid #334155;
            position: sticky; top: 0; z-index: 10;
        }
        
        .btn-logout {
            background: transparent; border: 1px solid #ef4444; color: #ef4444;
            border-radius: 8px; padding: 5px 15px; font-weight: bold;
        }
        .btn-logout:hover { background: #ef4444; color: white; }

        /* מד קלוריות זוהר */
        .progress-container {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 40px 0; position: relative;
        }
        /* עיגול רקע זוהר */
        .glow-bg {
            position: absolute; width: 180px; height: 180px; border-radius: 50%;
            background: radial-gradient(circle, rgba(34,197,94,0.15) 0%, rgba(15,23,42,0) 70%);
            z-index: 0;
        }
        
        .cal-number { font-size: 4rem; font-weight: 900; line-height: 1; color: white; z-index: 1; text-shadow: 0 0 10px rgba(255,255,255,0.2); }
        .cal-label { color: var(--primary); font-weight: bold; letter-spacing: 1px; margin-top: 5px; z-index: 1; text-transform: uppercase; }

        .meals-list { padding: 0 20px 100px 20px; } 
        
        .meal-card {
            background: var(--bg-card); border-left: 4px solid var(--primary);
            border-radius: 12px; padding: 15px; margin-bottom: 12px;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        .meal-time { color: var(--text-gray); font-size: 0.85rem; }
