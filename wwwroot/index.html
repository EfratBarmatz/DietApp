<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fitness Pro</title>
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text x=%2250%25%22 y=%2250%25%22 dominant-baseline=%22central%22 text-anchor=%22middle%22 font-size=%2280%22>🍏</text></svg>">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #0f172a;
            --glass-bg: rgba(30, 41, 59, 0.85);
            --glass-border: rgba(255, 255, 255, 0.1);
            --color-1: #f472b6;
            --color-2: #c084fc;
            --color-3: #fbbf24;
        }

        body {
            font-family: 'Assistant', sans-serif;
            background-color: var(--bg-dark);
            color: #f8fafc;
            margin: 0; min-height: 100vh;
            display: flex; flex-direction: column;
            overflow-x: hidden;
        }

        .glow-text {
            font-weight: 900;
            background: linear-gradient(to right, var(--color-1), var(--color-2), var(--color-3));
            -webkit-background-clip: text; background-clip: text; color: transparent;
            text-shadow: 0 0 30px rgba(244, 114, 182, 0.4);
            margin-bottom: 10px;
        }

        .auth-container {
            flex: 1; display: flex; flex-direction: column; justify-content: center;
            padding: 30px; max-width: 400px; margin: 0 auto; width: 100%;
        }
        
        .input-glass {
            background: var(--glass-bg); border: 1px solid var(--glass-border); color: white;
            border-radius: 15px; padding: 15px; font-size: 1.1rem; width: 100%;
            margin-bottom: 15px; backdrop-filter: blur(10px); transition: 0.3s;
        }

        .btn-glow {
            background: linear-gradient(135deg, var(--color-1), var(--color-2));
            color: white; font-weight: 800; padding: 15px; border-radius: 15px; border: none; width: 100%; font-size: 1.2rem;
            box-shadow: 0 5px 20px rgba(192, 132, 252, 0.4); margin-top: 10px; cursor: pointer; transition: 0.2s;
        }

        .password-wrapper { position: relative; width: 100%; }
        .password-wrapper input { padding-right: 45px !important; direction: ltr; }
        .password-toggle { position: absolute; right: 15px; top: 50%; transform: translateY(-55%); color: #94a3b8; cursor: pointer; z-index: 10; }

        .app-header {
            padding: 15px 20px; display: flex; justify-content: space-between; align-items: center;
            background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(10px);
            position: sticky; top: 0; z-index: 10; border-bottom: 1px solid var(--glass-border);
        }
        .btn-logout { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; border-radius: 50px; padding: 5px 15px; font-size: 0.9rem; }

        .progress-container {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 40px 0; position: relative;
        }
        
        .cal-number { font-size: 4.5rem; font-weight: 900; line-height: 1; z-index: 1; color: white; }
        .cal-label { color: var(--color-2); font-weight: bold; letter-spacing: 2px; margin-top: 5px; font-size: 0.9rem; }

        .meals-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 0 20px 100px; }
        
        .meal-card {
            background: var(--glass-bg); border: 1px solid var(--glass-border);
            border-radius: 20px; padding: 20px; text-align: center; cursor: pointer;
        }

        .border-morning { border-top: 4px solid var(--color-3); }
        .border-noon { border-top: 4px solid var(--color-1); }
        .border-evening { border-top: 4px solid var(--color-2); }
        .border-snack { border-top: 4px solid #82ca9d; }

        .fab {
            position: fixed; bottom: 30px; left: 30px; width: 65px; height: 65px; border-radius: 50%;
            background: linear-gradient(135deg, var(--color-1), var(--color-2));
            color: white; display: flex; align-items: center; justify-content: center;
            font-size: 2rem; z-index: 100;
        }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 200; display: none;
            align-items: center; justify-content: center; backdrop-filter: blur(8px);
        }
        .modal-box { background: #1e293b; width: 90%; max-width: 400px; padding: 25px; border-radius: 24px; border: 1px solid var(--glass-border); }
        .item-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .hidden { display: none !important; }
        .error-msg { background: rgba(239, 68, 68, 0.2); color: #fca5a5; padding: 10px; border-radius: 8px; margin-bottom: 15px; display: none; }
        .modal-label { color: #e2e8f0; font-size: 0.95rem; margin-bottom: 5px; display: block; font-weight: 600; }
    </style>
</head>
<body>

<div id="loginScreen" class="auth-container">
    <h1 class="glow-text" style="font-size: 3.5rem;">Fitness<br>Pro</h1>
    <div id="loginError" class="error-msg"></div>
    <input type="email" id="loginEmail" class="input-glass" placeholder="אימייל" dir="ltr">
    <div class="password-wrapper">
        <input type="password" id="loginPass" class="input-glass" placeholder="הסיסמה..." dir="ltr">
        <i class="bi bi-eye password-toggle" onclick="togglePass('loginPass', this)"></i>
    </div>
    <button onclick="login()" class="btn-glow">כניסה</button>
    <div class="text-center mt-3"><span onclick="showRegister()" style="color:var(--color-2); cursor:pointer;">הרשמה</span></div>
</div>

<div id="registerScreen" class="auth-container hidden">
    <h1 class="glow-text">הצטרפי</h1>
    <div id="regError" class="error-msg"></div>
    <input type="email" id="regEmail" class="input-glass" placeholder="אימייל" dir="ltr">
    <div class="password-wrapper">
        <input type="password" id="regPass" class="input-glass" placeholder="סיסמה" dir="ltr">
        <i class="bi bi-eye password-toggle" onclick="togglePass('regPass', this)"></i>
    </div>
    <button onclick="register()" class="btn-glow">צור חשבון</button>
    <div class="text-center mt-3"><span onclick="showLogin()" style="color:var(--color-2); cursor:pointer;">חזרה לכניסה</span></div>
</div>

<div id="appScreen" class="hidden">
    <div class="app-header">
        <div class="glow-text" style="font-size: 1.5rem; margin:0;">My Tracker</div>
        <button onclick="logout()" class="btn-logout">יציאה</button>
    </div>
    <div class="progress-container">
        <div class="cal-number" id="totalCalories">0</div>
        <div class="cal-label">קלוריות היום</div>
    </div>
    <div class="meals-grid" id="mealsGrid"></div>
    <div class="fab" onclick="openAddModal()"><i class="bi bi-plus-lg"></i></div>
</div>

<div class="modal-overlay" id="addModal">
    <div class="modal-box">
        <h4 class="text-white mb-3">הוספת ארוחה</h4>
        <label class="modal-label">ארוחה</label>
        <select id="mealType" class="input-glass">
            <option value="morning">🥐 בוקר</option>
            <option value="noon">🍛 צהריים</option>
            <option value="evening">🥗 ערב</option>
            <option value="snack">🥨 נשנוש</option>
        </select>
        <label class="modal-label">מה אכלת?</label>
        <input type="text" id="foodName" class="input-glass" placeholder="למשל: תפוח">
        <label class="modal-label">קלוריות</label>
        <input type="number" id="foodCal" class="input-glass">
        <button onclick="addMeal()" class="btn-glow">שמירה</button>
        <button onclick="closeModal('addModal')" class="btn btn-link text-white w-100">ביטול</button>
    </div>
</div>

<div class="modal-overlay" id="viewModal">
    <div class="modal-box">
        <div class="d-flex justify-content-between text-white mb-3">
            <h4 id="viewTitle"></h4>
            <i class="bi bi-x-lg" onclick="closeModal('viewModal')" style="cursor:pointer"></i>
        </div>
        <div id="itemsList" class="text-white"></div>
    </div>
</div>

<script>
    const API_URL = '/api';
    let currentUser = null;
    let allMeals = [];
    let lastDate = new Date().toDateString();

    function togglePass(id, icon) {
        const input = document.getElementById(id);
        input.type = input.type === 'password' ? 'text' : 'password';
        icon.classList.toggle('bi-eye'); icon.classList.toggle('bi-eye-slash');
    }

    function init() {
        const saved = localStorage.getItem('dietUser');
        if (saved) {
            currentUser = JSON.parse(saved);
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('appScreen').classList.remove('hidden');
            loadData();
            setInterval(() => {
                if (new Date().toDateString() !== lastDate) location.reload();
            }, 10000);
        }
    }

    async function login() {
        const email = document.getElementById('loginEmail').value;
        const pass = document.getElementById('loginPass').value;
        try {
            const res = await fetch(`${API_URL}/auth/login`, {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ email, password: pass })
            });
            if (res.ok) {
                const data = await res.json();
                currentUser = { id: data.userId, email: data.email };
                localStorage.setItem('dietUser', JSON.stringify(currentUser));
                location.reload();
            } else document.getElementById('loginError').style.display = 'block';
        } catch(e) {}
    }

    async function register() {
        const email = document.getElementById('regEmail').value;
        const pass = document.getElementById('regPass').value;
        const res = await fetch(`${API_URL}/auth/register`, {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ email, password: pass })
        });
        if (res.ok) { alert('נרשמת בהצלחה'); showLogin(); }
    }

    function showRegister() { document.getElementById('loginScreen').classList.add('hidden'); document.getElementById('registerScreen').classList.remove('hidden'); }
    function showLogin() { document.getElementById('registerScreen').classList.add('hidden'); document.getElementById('loginScreen').classList.remove('hidden'); }
    function logout() { localStorage.removeItem('dietUser'); location.reload(); }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }
    function openAddModal() { document.getElementById('addModal').style.display = 'flex'; }

    async function loadData() {
        if (!currentUser) return;
        const res = await fetch(`${API_URL}/meals?userId=${currentUser.id}`);
        allMeals = await res.json();
        renderGrid();
    }

    function renderGrid() {
        const today = new Date().toDateString();
        const todaysMeals = allMeals.filter(m => new Date(m.date).toDateString() === today);
        document.getElementById('totalCalories').innerText = todaysMeals.reduce((s, m) => s + m.calories, 0);

        const cats = { morning: {t:'בוקר', i:'🥐', b:'border-morning', cal:0, n:0}, noon: {t:'צהריים', i:'🍛', b:'border-noon', cal:0, n:0}, evening: {t:'ערב', i:'🥗', b:'border-evening', cal:0, n:0}, snack: {t:'נשנוש', i:'🥨', b:'border-snack', cal:0, n:0} };

        todaysMeals.forEach(m => {
            const h = new Date(m.date).getHours();
            let k = 'snack';
            if (h >= 5 && h < 12) k = 'morning'; else if (h >= 12 && h < 17) k = 'noon'; else if (h >= 17 && h < 22) k = 'evening';
            cats[k].cal += m.calories; cats[k].n++;
        });

        const grid = document.getElementById('mealsGrid');
        grid.innerHTML = '';
        Object.keys(cats).forEach(k => {
            const c = cats[k];
            grid.innerHTML += `<div class="meal-card ${c.b}" onclick="showDetails('${k}')"><h3>${c.i}</h3><div>${c.t}</div><div class="fw-bold">${c.cal}</div><small>${c.n} פריטים</small></div>`;
        });
    }

    function showDetails(key) {
        document.getElementById('viewTitle').innerText = key;
        const today = new Date().toDateString();
        const items = allMeals.filter(m => {
            if (new Date(m.date).toDateString() !== today) return false;
            const h = new Date(m.date).getHours();
            if (key === 'morning') return h >= 5 && h < 12;
            if (key === 'noon') return h >= 12 && h < 17;
            if (key === 'evening') return h >= 17 && h < 22;
            return h < 5 || h >= 22;
        });
        const list = document.getElementById('itemsList');
        list.innerHTML = items.length ? '' : 'ריק';
        items.forEach(m => {
            const time = new Date(m.date).toLocaleTimeString('he-IL', {hour:'2-digit', minute:'2-digit'});
            list.innerHTML += `<div class="item-row"><div>${m.name}<br><small>${time}</small></div><div>${m.calories}</div></div>`;
        });
        document.getElementById('viewModal').style.display = 'flex';
    }

    async function addMeal() {
        const type = document.getElementById('mealType').value;
        const name = document.getElementById('foodName').value;
        const cal = document.getElementById('foodCal').value;
        const dateStr = new Date().toISOString();
        await fetch(`${API_URL}/meals`, {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ name, calories: parseInt(cal), date: dateStr, userId: currentUser.id })
        });
        closeModal('addModal');
        loadData();
    }

    init();
</script>
</body>
</html>
