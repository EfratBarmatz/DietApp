<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dreamy Diet</title>
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text x=%2250%25%22 y=%2250%25%22 dominant-baseline=%22central%22 text-anchor=%22middle%22 font-size=%2280%22>🍏</text></svg>">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #0f172a;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --color-1: #f472b6; /* ורוד */
            --color-2: #c084fc; /* סגול */
            --color-3: #fbbf24; /* זהב */
            --color-4: #38bdf8; /* תכלת */
        }

        body {
            font-family: 'Assistant', sans-serif;
            background-color: var(--bg-dark);
            color: #f8fafc;
            margin: 0; min-height: 100vh;
            display: flex; flex-direction: column;
            overflow-x: hidden;
        }

        .glow-text {
            font-weight: 900;
            background: linear-gradient(to right, var(--color-1), var(--color-2), var(--color-3), var(--color-4));
            -webkit-background-clip: text; background-clip: text; color: transparent;
            text-shadow: 0 0 30px rgba(244, 114, 182, 0.4);
            margin-bottom: 10px;
        }

        .auth-container {
            flex: 1; display: flex; flex-direction: column; justify-content: center;
            padding: 30px; max-width: 400px; margin: 0 auto; width: 100%;
        }
        
        .input-glass {
            background: var(--glass-bg); border: 1px solid var(--glass-border); color: white;
            border-radius: 15px; padding: 15px; font-size: 1.1rem; width: 100%;
            margin-bottom: 15px; backdrop-filter: blur(10px); transition: 0.3s;
        }
        .input-glass:focus { outline: none; border-color: var(--color-1); box-shadow: 0 0 15px rgba(244, 114, 182, 0.3); }

        .btn-glow {
            background: linear-gradient(135deg, var(--color-1), var(--color-2));
            color: white; font-weight: 800; padding: 15px; border-radius: 15px; border: none; width: 100%; font-size: 1.2rem;
            box-shadow: 0 5px 20px rgba(192, 132, 252, 0.4); margin-top: 10px; cursor: pointer; transition: 0.2s;
        }
        .btn-glow:hover { transform: scale(1.02); filter: brightness(1.1); }

        .password-wrapper { position: relative; width: 100%; }
        .password-wrapper input { padding-left: 45px !important; direction: ltr; }
        .password-toggle { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #94a3b8; cursor: pointer; z-index: 10; }

        .app-header {
            padding: 15px 20px; display: flex; justify-content: space-between; align-items: center;
            background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(10px);
            position: sticky; top: 0; z-index: 10; border-bottom: 1px solid var(--glass-border);
        }
        .btn-logout { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; border-radius: 50px; padding: 5px 15px; font-size: 0.9rem; }

        .progress-container {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 40px 0; position: relative;
        }
        .glow-bg {
            position: absolute; width: 220px; height: 220px; border-radius: 50%;
            background: radial-gradient(circle, rgba(192, 132, 252, 0.2) 0%, rgba(15,23,42,0) 70%);
            animation: pulse 4s infinite ease-in-out; z-index: 0;
        }
        @keyframes pulse { 0% { transform: scale(1); opacity: 0.5; } 50% { transform: scale(1.1); opacity: 0.8; } 100% { transform: scale(1); opacity: 0.5; } }
        
        .cal-number { 
            font-size: 4.5rem; font-weight: 900; line-height: 1; z-index: 1;
            background: linear-gradient(to bottom, #ffffff, #e2e8f0);
            -webkit-background-clip: text; background-clip: text; color: transparent;
        }
        .cal-label { color: var(--color-2); font-weight: bold; letter-spacing: 2px; margin-top: 5px; z-index: 1; text-transform: uppercase; font-size: 0.9rem; }

        .meals-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 0 20px 100px; }
        
        .meal-card {
            background: var(--glass-bg); border: 1px solid var(--glass-border);
            border-radius: 20px; padding: 20px; backdrop-filter: blur(10px);
            display: flex; flex-direction: column; align-items: center; text-align: center;
            transition: 0.2s; cursor: pointer;
        }
        .meal-card:active { transform: scale(0.95); background: rgba(255,255,255,0.1); }

        .card-icon { font-size: 2rem; margin-bottom: 10px; }
        .card-title { font-weight: 700; font-size: 1.1rem; margin-bottom: 5px; color: #e2e8f0; }
        .card-cal { font-size: 1.4rem; font-weight: 900; color: white; text-shadow: 0 0 10px rgba(255,255,255,0.3); }
        .card-sub { font-size: 0.85rem; color: #94a3b8; }

        .border-morning { border-top: 4px solid var(--color-3); }
        .border-noon { border-top: 4px solid var(--color-1); }
        .border-evening { border-top: 4px solid var(--color-2); }
        .border-snack { border-top: 4px solid var(--color-4); }

        .fab {
            position: fixed; bottom: 30px; left: 30px;
            width: 65px; height: 65px; border-radius: 50%;
            background: linear-gradient(135deg, var(--color-1), var(--color-2));
            color: white; display: flex; align-items: center; justify-content: center;
            font-size: 2rem; box-shadow: 0 0 25px rgba(192, 132, 252, 0.5); 
            cursor: pointer; z-index: 100; transition: 0.3s;
        }
        .fab:hover { transform: scale(1.1) rotate(90deg); }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 200; display: none;
            align-items: center; justify-content: center; backdrop-filter: blur(8px);
        }
        .modal-box {
            background: #1e293b; width: 90%; max-width: 400px; padding: 25px;
            border-radius: 24px; box-shadow: 0 0 40px rgba(0,0,0,0.5); border: 1px solid var(--glass-border);
            animation: slideUp 0.3s ease;
        }
        @keyframes slideUp { from { transform: translateY(50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .item-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .hidden { display: none !important; }
        .error-msg { background: rgba(239, 68, 68, 0.2); color: #fca5a5; padding: 10px; border-radius: 8px; border: 1px solid #ef4444; margin-bottom: 15px; display: none; }
        .link-btn { color: var(--color-2); cursor: pointer; font-weight: 700; text-decoration: underline; }
        .close-btn { float: left; font-size: 1.5rem; cursor: pointer; color: #94a3b8; }
        
        /* תיקון נראות תוויות */
        .modal-label { color: #cbd5e1; font-size: 0.9rem; margin-bottom: 5px; display: block; }
        
        /* כפתורי אישור וביטול מעוצבים */
        .btn-confirm { background: #ef4444; color: white; border: none; padding: 10px 20px; border-radius: 12px; font-weight: bold; width: 45%; }
        .btn-cancel { background: rgba(255,255,255,0.1); color: white; border: none; padding: 10px 20px; border-radius: 12px; font-weight: bold; width: 45%; }
    </style>
</head>
<body>

<div id="loginScreen" class="auth-container">
    <h1 class="glow-text" style="font-size: 3.5rem; line-height: 1.2;">Fitness<br>Pro</h1>
    <p style="color: #94a3b8; font-size: 1.2rem; margin-bottom: 30px;">האנרגיה שלך מתחילה כאן.</p>
    
    <div id="loginError" class="error-msg"></div>

    <input type="email" id="loginEmail" class="input-glass" placeholder="אימייל" dir="ltr">
    <div class="password-wrapper">
        <input type="password" id="loginPass" class="input-glass" placeholder="הסיסמה הסודית..." dir="ltr">
        <i class="bi bi-eye password-toggle" onclick="togglePass('loginPass', this)"></i>
    </div>
    <button onclick="login()" class="btn-glow">כניסה למערכת</button>
    <div class="text-center mt-3"><span style="color: #94a3b8;">חדשה?</span> <span onclick="showRegister()" class="link-btn">הרשמה</span></div>
</div>

<div id="registerScreen" class="auth-container hidden">
    <h1 class="glow-text">הצטרפי</h1>
    <p style="color: #94a3b8; margin-bottom: 30px;">התחילי את השינוי היום.</p>
    <div id="regError" class="error-msg"></div>
    <input type="email" id="regEmail" class="input-glass" placeholder="אימייל" dir="ltr">
    <div class="password-wrapper">
        <input type="password" id="regPass" class="input-glass" placeholder="סיסמה (8+ תווים)" dir="ltr">
        <i class="bi bi-eye password-toggle" onclick="togglePass('regPass', this)"></i>
    </div>
    <button onclick="register()" class="btn-glow">יצירת חשבון</button>
    <div class="text-center mt-3"><span onclick="showLogin()" class="link-btn">חזרה לכניסה</span></div>
</div>

<div id="appScreen" class="hidden">
    <div class="app-header">
        <div class="glow-text" style="font-size: 1.5rem; margin:0; text-shadow:none;">My Tracker</div>
        <button onclick="logout()" class="btn-logout">יציאה</button>
    </div>

    <div class="progress-container">
        <div class="glow-bg"></div>
        <div class="cal-number" id="totalCalories">0</div>
        <div class="cal-label">קלוריות היום</div>
    </div>

    <div class="meals-grid" id="mealsGrid"></div>

    <div class="fab" onclick="openAddModal()"><i class="bi bi-plus-lg"></i></div>
</div>

<div class="modal-overlay" id="addModal">
    <div class="modal-box">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="m-0 fw-bold text-white">הוספת ארוחה</h4>
            <i class="bi bi-x-lg close-btn" onclick="closeModal('addModal')"></i>
        </div>
        
        <label class="modal-label">איזו ארוחה זו?</label>
        <select id="mealType" class="input-glass mb-3" style="padding:10px;">
            <option value="morning" style="color:black">🥐 בוקר (זהב)</option>
            <option value="noon" style="color:black">🍛 צהריים (ורוד)</option>
            <option value="evening" style="color:black">🥗 ערב (סגול)</option>
            <option value="snack" style="color:black">🥨 נשנוש (תכלת)</option>
        </select>

        <label class="modal-label">מה אכלת?</label>
        <input type="text" id="foodName" class="input-glass mb-3" placeholder="למשל: יוגורט">

        <label class="modal-label">קלוריות</label>
        <input type="number" id="foodCal" class="input-glass mb-4" placeholder="0">

        <button onclick="addMeal()" class="btn-glow">שמירה</button>
    </div>
</div>

<div class="modal-overlay" id="viewModal">
    <div class="modal-box">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="m-0 fw-bold text-white" id="viewTitle">ארוחת בוקר</h4>
            <i class="bi bi-x-lg close-btn" onclick="closeModal('viewModal')"></i>
        </div>
        
        <div id="itemsList" style="max-height: 300px; overflow-y: auto; color: white;">
            </div>
    </div>
</div>

<div class="modal-overlay" id="confirmModal">
    <div class="modal-box text-center">
        <i class="bi bi-exclamation-circle text-danger" style="font-size: 3rem; margin-bottom: 10px;"></i>
        <h4 class="text-white fw-bold mb-2">למחוק את הארוחה?</h4>
        <p style="color: #94a3b8; margin-bottom: 20px;">לא ניתן יהיה לשחזר את הנתונים לאחר המחיקה.</p>
        
        <div class="d-flex justify-content-between">
            <button onclick="closeModal('confirmModal')" class="btn-cancel">ביטול</button>
            <button onclick="performDelete()" class="btn-confirm">מחיקה</button>
        </div>
    </div>
</div>

<div class="modal-overlay" id="alertModal">
    <div class="modal-box text-center">
        <i class="bi bi-check-circle text-success" style="font-size: 3rem; margin-bottom: 10px;" id="alertIcon"></i>
        <h4 class="text-white fw-bold mb-3" id="alertTitle">הצלחה!</h4>
        <p style="color: #94a3b8; margin-bottom: 20px;" id="alertText">הפעולה בוצעה בהצלחה</p>
        <button onclick="closeModal('alertModal')" class="btn-glow" style="padding: 10px;">אישור</button>
    </div>
</div>

<script>
    const API_URL = '/api';
    let currentUser = null;
    let allMeals = []; 
    let mealToDelete = null; // משתנה לשמירת ה-ID למחיקה

    function togglePass(inputId, icon) {
        const input = document.getElementById(inputId);
        if (input.type === "password") {
            input.type = "text";
            icon.classList.remove("bi-eye");
            icon.classList.add("bi-eye-slash");
        } else {
            input.type = "password";
            icon.classList.remove("bi-eye-slash");
            icon.classList.add("bi-eye");
        }
    }

    function showError(elementId, msg) { const el = document.getElementById(elementId); el.innerText = msg; el.style.display = 'block'; }
    function clearErrors() { document.getElementById('loginError').style.display = 'none'; document.getElementById('regError').style.display = 'none'; }

    // פונקציה להצגת הודעות מעוצבות במקום alert רגיל
    function showAlert(title, text, isSuccess = true)
