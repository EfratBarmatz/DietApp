<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fitness Pro - היומן שלי</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="app-header">
        <div class="glow-text" style="font-size: 1.5rem; margin:0;">My Tracker</div>
        <button onclick="logout()" class="btn-logout">יציאה</button>
    </div>

    <div class="progress-container">
        <div class="glow-bg"></div>
        <div class="cal-number" id="totalCalories">0</div>
        <div class="goal-text" onclick="setDailyGoal()">יעד: <span id="goalNumber">1500</span></div>
        <div class="progress-bar-container">
            <div class="progress-bar-fill" id="progressBar"></div>
        </div>
    </div>

    <div class="meals-grid" id="mealsGrid"></div>
    <div class="fab" onclick="openAddModal()"><i class="bi bi-plus-lg"></i></div>

    <div class="modal-overlay" id="addModal">...</div>
    <script src="js/app.js"></script> </body>
</html>
