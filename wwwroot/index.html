<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fitness Pro</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text x=%2250%25%22 y=%2250%25%22 dominant-baseline=%22central%22 text-anchor=%22middle%22 font-size=%2280%22>🍏</text></svg>">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg-dark: #0f172a; --glass-bg: rgba(30, 41, 59, 0.85); --glass-border: rgba(255, 255, 255, 0.1); --color-1: #f472b6; --color-2: #c084fc; --color-3: #fbbf24; }
        body { font-family: 'Assistant', sans-serif; background-color: var(--bg-dark); color: #f8fafc; margin: 0; min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }
        .glow-text { font-weight: 900; background: linear-gradient(to right, var(--color-1), var(--color-2), var(--color-3)); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: 0 0 30px rgba(244, 114, 182, 0.4); margin-bottom: 10px; }
        .auth-container { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 30px; max-width: 400px; margin: 0 auto; width: 100%; }
        .input-glass { background: var(--glass-bg); border: 1px solid var(--glass-border); color: white; border-radius: 15px; padding: 15px; font-size: 1.1rem; width: 100%; margin-bottom: 15px; backdrop-filter: blur(10px); transition: 0.3s; }
        .btn-glow { background: linear-gradient(135deg, var(--color-1), var(--color-2)); color: white; font-weight: 800; padding: 15px; border-radius: 15px; border: none; width: 100%; font-size: 1.2rem; box-shadow: 0 5px 20px rgba(192, 132, 252, 0.4); margin-top: 10px; cursor: pointer; }
        .password-wrapper { position: relative; width: 100%; }
        .password-wrapper input { padding-right: 45px !important; padding-left: 15px !important; direction: ltr; }
        .password-toggle { position: absolute; right: 15px; top: 50%; transform: translateY(-55%); color: #94a3b8; cursor: pointer; z-index: 10; }
        .app-header { padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 10; border-bottom: 1px solid var(--glass-border); }
        .progress-container { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 0; position: relative; }
        .cal-number { font-size: 4.5rem; font-weight: 900; line-height: 1; background: linear-gradient(to bottom, #ffffff, #e2e8f0); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .cal-label { color: var(--color-2); font-weight: bold; letter-spacing: 2px; margin-top: 5px; text-transform: uppercase; font-size: 0.9rem; }
        .meals-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 0 20px 100px; }
        .meal-card { background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 20px; padding: 20px; backdrop-filter: blur(10px); display: flex; flex-direction: column; align-items: center; text-align: center; transition: 0.2s; cursor: pointer; }
        .border-morning { border-top: 4px solid var(--color-3); }
        .border-noon { border-top: 4px solid var(--color-1); }
        .border-evening { border-top: 4px solid var(--color-2); }
        .border-snack { border-top: 4px solid #82ca9d; }
        .fab { position: fixed; bottom: 30px; left: 30px; width: 65px; height: 65px; border-radius: 50%; background: linear-gradient(135deg, var(--color-1), var(--color-2)); color: white; display: flex; align-items: center; justify-content: center; font-size: 2rem; box-shadow: 0 0 25px rgba(192, 132, 252, 0.5); cursor: pointer; z-index: 100; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 200; display: none; align-items: center; justify-content: center; backdrop-filter: blur(8px); }
        .modal-box { background: #1e293b; width: 90%; max-width: 400px; padding: 25px; border-radius: 24px; border: 1px solid var(--glass-border); }
        .item-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .hidden { display: none !important; }
        .close-btn { float: left; font-size: 1.5rem; cursor: pointer; color: #94a3b8; }
        .modal-label { color: #e2e8f0; font-size: 0.95rem; margin-bottom: 5px; display: block; font-weight: 600; }
    </style>
</head>
<body>

<div id="loginScreen" class="auth-container">
    <h1 class="glow-text" style="font-size: 3.5rem;">Fitness<br>Pro</h1>
    <input type="email" id="loginEmail" class="input-glass" placeholder="אימייל" dir="ltr">
    <div class="password-wrapper">
        <input type="password" id="loginPass" class="input-glass" placeholder="סיסמה" dir="ltr">
        <i class="bi bi-eye password-toggle" onclick="togglePass('loginPass', this)"></i>
    </div>
    <button onclick="login()" class="btn-glow">כניסה</button>
</div>

<div id="appScreen" class="hidden">
    <div class="app-header">
        <div class="glow-text" style="font-size: 1.5rem; margin:0;">My Tracker</div>
        <button onclick="logout()" class="btn btn-outline-light btn-sm rounded-pill">יציאה</button>
    </div>
    <div class="progress-container">
        <div class="cal-number" id="totalCalories">0</div>
        <div class="cal-label">קלוריות היום</div>
    </div>
    <div class="meals-grid" id="mealsGrid"></div>
    <div class="fab" onclick="openAddModal()"><i class="bi bi-plus-lg"></i></div>
</div>

<div class="modal-overlay" id="addModal">
    <div class="modal-box">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="m-0 fw-bold text-white">הוספת ארוחה</h4>
            <i class="bi bi-x-lg close-btn" onclick="closeModal('addModal')"></i>
        </div>
        <label class="modal-label">איזו ארוחה זו?</label>
        <select id="mealTypeSelect" class="input-glass">
            <option value="morning">🥐 בוקר</option>
            <option value="noon">🍛 צהריים</option>
            <option value="evening">🥗 ערב</option>
            <option value="snack">🥨 נשנוש</option>
        </select>
        <input type="text" id="foodName" class="input-glass" placeholder="מה אכלת?">
        <input type="number" id="foodCal" class="input-glass" placeholder="קלוריות">
        <button onclick="addMeal()" class="btn-glow">שמירה</button>
    </div>
</div>

<div class="modal-overlay" id="viewModal">
    <div class="modal-box">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="m-0 fw-bold text-white" id="viewTitle">ארוחה</h4>
            <i class="bi bi-x-lg close-btn" onclick="closeModal('viewModal')"></i>
        </div>
        <div id="itemsList" style="max-height: 300px; overflow-y: auto; color: white;"></div>
    </div>
</div>

<script>
    const API_URL = '/api';
    let currentUser = null;
    let allMeals = [];
    let lastKnownDate = new Date().toDateString();

    function togglePass(id, icon) {
        const input = document.getElementById(id);
        input.type = input.type === "password" ? "text" : "password";
        icon.classList.toggle("bi-eye"); icon.classList.toggle("bi-eye-slash");
    }

    function init() {
        const saved = localStorage.getItem('dietUser');
        if (saved) {
            currentUser = JSON.parse(saved);
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('appScreen').classList.remove('hidden');
            loadData();
            setInterval(() => { if (new Date().toDateString() !== lastKnownDate) location.reload(); }, 10000);
        }
    }

    async function login() {
        const email = document.getElementById('loginEmail').value;
        const pass = document.getElementById('loginPass').value;
        const res = await fetch(`${API_URL}/auth/login`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ email, password: pass }) });
        if (res.ok) { const data = await res.json(); currentUser = { id: data.userId, email: data.email }; localStorage.setItem('dietUser', JSON.stringify(currentUser)); location.reload(); }
    }

    function closeModal(id) { 
        document.getElementById(id).style.display = 'none';
        if(id === 'addModal') { // ניקוי הטופס בסגירה
            document.getElementById('foodName').value = '';
            document.getElementById('foodCal').value = '';
        }
    }

    function openAddModal() {
        const modal = document.getElementById('addModal');
        const select = document.getElementById('mealTypeSelect');
        const hour = new Date().getHours();
        
        // ניחוש חכם לפי שעה אבל נותן לך לשנות
        if (hour >= 5 && hour < 11) select.value = 'morning';
        else if (hour >= 11 && hour < 14) select.value = 'snack'; // נשנוש לפני צהריים
        else if (hour >= 14 && hour < 17) select.value = 'noon';
        else if (hour >= 17 && hour < 22) select.value = 'evening';
        else select.value = 'snack';

        modal.style.display = 'flex';
    }

    async function loadData() {
        if (!currentUser) return;
        const res = await fetch(`${API_URL}/meals?userId=${currentUser.id}`);
        allMeals = await res.json();
        renderGrid();
    }

    function renderGrid() {
        const todayStr = new Date().toDateString();
        const todaysMeals = allMeals.filter(m => new Date(m.date).toDateString() === todayStr);
        document.getElementById('totalCalories').innerText = todaysMeals.reduce((sum, m) => sum + m.calories, 0);

        const cats = {
            morning: { title: 'בוקר', icon: '🥐', cal: 0, items: [], css: 'border-morning' },
            noon: { title: 'צהריים', icon: '🍛', cal: 0, items: [], css: 'border-noon' },
            evening: { title: 'ערב', icon: '🥗', cal: 0, items: [], css: 'border-evening' },
            snack: { title: 'נשנוש', icon: '🥨', cal: 0, items: [], css: 'border-snack' }
        };

        todaysMeals.forEach(m => {
            const h = new Date(m.date).getHours();
            let key = 'snack';
            if (h === 9) key = 'morning'; else if (h === 14) key = 'noon'; else if (h === 20) key = 'evening';
            if (cats[key]) { cats[key].cal += m.calories; cats[key].items.push(m); }
        });

        const grid = document.getElementById('mealsGrid');
        grid.innerHTML = '';
        Object.keys(cats).forEach(key => {
            const cat = cats[key];
            grid.innerHTML += `<div class="meal-card ${cat.css}" onclick="showCategoryDetails('${key}')"><div class="card-icon">${cat.icon}</div><div class="card-title">${cat.title}</div><div class="card-cal">${cat.cal}</div><div class="card-sub">${cat.items.length} פריטים</div></div>`;
        });
    }

    function showCategoryDetails(key) {
        const titles = { morning: 'ארוחת בוקר', noon: 'ארוחת צהריים', evening: 'ארוחת ערב', snack: 'נשנושים' };
        document.getElementById('viewTitle').innerText = titles[key];
        const todayStr = new Date().toDateString();
        const items = allMeals.filter(m => {
            if (new Date(m.date).toDateString() !== todayStr) return false;
            const h = new Date(m.date).getHours();
            if (key === 'morning') return h === 9;
            if (key === 'noon') return h === 14;
            if (key === 'evening') return h === 20;
            return h !== 9 && h !== 14 && h !== 20;
        });

        const list = document.getElementById('itemsList');
        list.innerHTML = items.length ? '' : 'ריק';
        items.forEach(m => {
            const time = new Date(m.date).toLocaleTimeString('he-IL', {hour:'2-digit', minute:'2-digit'});
            list.innerHTML += `<div class="item-row"><div><b>${m.name}</b><br><small>${time}</small></div><div>${m.calories}</div></div>`;
        });
        document.getElementById('viewModal').style.display = 'flex';
    }

    async function addMeal() {
        const type = document.getElementById('mealTypeSelect').value;
        const name = document.getElementById('foodName').value;
        const cal = document.getElementById('foodCal').value;
        if(!name || !cal) return;

        let d = new Date();
        if(type === 'morning') d.setHours(9,0,0);
        else if(type === 'noon') d.setHours(14,0,0);
        else if(type === 'evening') d.setHours(20,0,0);
        else d.setHours(23,0,0);

        const dateStr = new Date(d.getTime() - (d.getTimezoneOffset() * 60000)).toISOString().slice(0, -1);
        await fetch(`${API_URL}/meals`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ name, calories: parseInt(cal), date: dateStr, userId: currentUser.id }) });
        
        closeModal('addModal'); // סוגר ומנקה
        loadData();
    }

    function logout() { localStorage.removeItem('dietUser'); location.reload(); }
    init();
</script>
</body>
</html>
