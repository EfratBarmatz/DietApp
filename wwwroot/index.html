<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fitness Pro - היומן שלי</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text x=%2250%25%22 y=%2250%25%22 dominant-baseline=%22central%22 text-anchor=%22middle%22 font-size=%2280%22>🍏</text></svg>">
</head>
<body>

    <div class="app-header">
        <div class="glow-text" style="font-size: 1.5rem; margin:0;">My Tracker</div>
        <button onclick="logout()" class="btn-logout">יציאה</button>
    </div>

    <div class="progress-container">
        <div class="glow-bg"></div>
        <div class="cal-number" id="totalCalories">0</div>
        <div class="goal-text" onclick="setDailyGoal()">יעד: <span id="goalNumber">1500</span></div>
        <div class="progress-bar-container">
            <div class="progress-bar-fill" id="progressBar"></div>
        </div>
    </div>

    <div class="meals-grid" id="mealsGrid"></div>
    <div class="fab" onclick="openAddModal()"><i class="bi bi-plus-lg"></i></div>

    <div class="modal-overlay" id="addModal">...</div>
    <div class="modal-overlay" id="addModal">
        <div class="modal-box">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4 class="m-0 fw-bold text-white">הוספת ארוחה</h4>
                <i class="bi bi-x-lg close-btn" onclick="closeModal('addModal')"></i>
            </div>
            
            <div id="addError" class="error-msg"></div>

            <label class="modal-label">קטגוריה</label>
            <select id="mealType" class="input-glass" style="color: black;"> <option value="morning">🥐 בוקר</option>
                <option value="noon">🍛 צהריים</option>
                <option value="evening">🥗 ערב</option>
                <option value="snack">🥨 נשנוש</option>
            </select>
            
            <input type="text" id="foodName" class="input-glass" placeholder="מה אכלת?">
            <input type="number" id="foodCal" class="input-glass" placeholder="קלוריות">
            
            <div class="d-flex gap-3 mb-3">
                <label class="text-white" style="cursor:pointer">
                    <input type="radio" name="timeT" value="now" checked onclick="toggleTime(false)"> עכשיו
                </label>
                <label class="text-white" style="cursor:pointer">
                    <input type="radio" name="timeT" value="custom" onclick="toggleTime(true)"> שעה אחרת
                </label>
            </div>
            <input type="time" id="customTime" class="input-glass hidden">

            <button onclick="addMeal()" class="btn-glow" id="addMealBtn">שמירה</button>
        </div>
    </div>

    <div class="modal-overlay" id="viewModal">
        <div class="modal-box">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4 class="m-0 fw-bold text-white" id="viewTitle"></h4>
                <i class="bi bi-x-lg close-btn" onclick="closeModal('viewModal')"></i>
            </div>
            <div id="itemsList" style="max-height: 300px; overflow-y: auto;"></div>
        </div>
    </div>

    <div class="modal-overlay" id="confirmModal">
        <div class="modal-box text-center">
            <i class="bi bi-trash3 text-danger" style="font-size: 3rem; margin-bottom: 15px; display:block;"></i>
            <h4 class="text-white fw-bold mb-4">למחוק את הארוחה?</h4>
            <div class="d-flex justify-content-between">
                <button onclick="closeModal('confirmModal')" class="btn-cancel">ביטול</button>
                <button onclick="performDelete()" class="btn-confirm">מחיקה</button>
            </div>
        </div>
    </div>
    <script src="js/app.js"></script> </body>
</html>
