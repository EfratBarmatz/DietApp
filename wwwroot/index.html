<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fitness Pro</title>
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text x=%2250%25%22 y=%2250%25%22 dominant-baseline=%22central%22 text-anchor=%22middle%22 font-size=%2280%22>🍏</text></svg>">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #0f172a;
            --glass-bg: rgba(30, 41, 59, 0.85);
            --glass-border: rgba(255, 255, 255, 0.1);
            --color-1: #f472b6; 
            --color-2: #c084fc; 
            --color-3: #fbbf24; 
        }

        body {
            font-family: 'Assistant', sans-serif;
            background-color: var(--bg-dark);
            color: #f8fafc;
            margin: 0; min-height: 100vh;
            display: flex; flex-direction: column;
            overflow-x: hidden;
        }

        .glow-text {
            font-weight: 900;
            background: linear-gradient(to right, var(--color-1), var(--color-2), var(--color-3));
            -webkit-background-clip: text; background-clip: text; color: transparent;
            text-shadow: 0 0 30px rgba(244, 114, 182, 0.4);
            margin-bottom: 10px;
        }

        .auth-container {
            flex: 1; display: flex; flex-direction: column; justify-content: center;
            padding: 30px; max-width: 400px; margin: 0 auto; width: 100%;
        }
        
        .input-glass {
            background: var(--glass-bg); border: 1px solid var(--glass-border); color: white;
            border-radius: 15px; padding: 15px; font-size: 1.1rem; width: 100%;
            margin-bottom: 15px; backdrop-filter: blur(10px); transition: 0.3s;
        }
        .input-glass:focus { outline: none; border-color: var(--color-1); box-shadow: 0 0 15px rgba(244, 114, 182, 0.3); }

        .btn-glow {
            background: linear-gradient(135deg, var(--color-1), var(--color-2));
            color: white; font-weight: 800; padding: 15px; border-radius: 15px; border: none; width: 100%; font-size: 1.2rem;
            box-shadow: 0 5px 20px rgba(192, 132, 252, 0.4); margin-top: 10px; cursor: pointer; transition: 0.2s;
        }
        .btn-glow:hover { transform: scale(1.02); filter: brightness(1.1); }
        .btn-glow:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .password-wrapper { position: relative; width: 100%; }
        .password-wrapper input { 
            padding-right: 45px !important;
            padding-left: 15px !important; 
            direction: ltr; 
        }
        .password-toggle { 
            position: absolute; 
            right: 15px; 
            left: auto; 
            top: 50%; 
            transform: translateY(-55%); 
            color: #94a3b8; 
            cursor: pointer; 
            z-index: 10; 
        }

        .app-header {
            padding: 15px 20px; display: flex; justify-content: space-between; align-items: center;
            background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(10px);
            position: sticky; top: 0; z-index: 10; border-bottom: 1px solid var(--glass-border);
        }
        .btn-logout { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; border-radius: 50px; padding: 5px 15px; font-size: 0.9rem; }

        .progress-container {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 40px 0; position: relative;
        }
        .glow-bg {
            position: absolute; width: 220px; height: 220px; border-radius: 50%;
            background: radial-gradient(circle, rgba(192, 132, 252, 0.2) 0%, rgba(15,23,42,0) 70%);
            animation: pulse 4s infinite ease-in-out; z-index: 0;
        }
        @keyframes pulse { 0% { transform: scale(1); opacity: 0.5; } 50% { transform: scale(1.1); opacity: 0.8; } 100% { transform: scale(1); opacity: 0.5; } }
        
        .cal-number { 
            font-size: 4.5rem; font-weight: 900; line-height: 1; z-index: 1;
            background: linear-gradient(to bottom, #ffffff, #e2e8f0);
            -webkit-background-clip: text; background-clip: text; color: transparent;
        }
        .cal-label { color: var(--color-2); font-weight: bold; letter-spacing: 2px; margin-top: 5px; z-index: 1; text-transform: uppercase; font-size: 0.9rem; }

        .meals-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 0 20px 100px; }
        
        .meal-card {
            background: var(--glass-bg); border: 1px solid var(--glass-border);
            border-radius: 20px; padding: 20px; backdrop-filter: blur(10px);
            display: flex; flex-direction: column; align-items: center; text-align: center;
            transition: 0.2s; cursor: pointer;
        }
        .meal-card:active { transform: scale(0.95); background: rgba(255,255,255,0.1); }

        .card-icon { font-size: 2rem; margin-bottom: 10px; }
        .card-title { font-weight: 700; font-size: 1.1rem; margin-bottom: 5px; color: #e2e8f0; }
        .card-cal { font-size: 1.4rem; font-weight: 900; color: white; text-shadow: 0 0 10px rgba(255,255,255,0.3); }
        .card-sub { font-size: 0.85rem; color: #94a3b8; }

        .border-morning { border-top: 4px solid var(--color-3); }
        .border-noon { border-top: 4px solid var(--color-1); }
        .border-evening { border-top: 4px solid var(--color-2); }
        .border-snack { border-top: 4px solid #82ca9d; }

        .fab {
            position: fixed; bottom: 30px; left: 30px;
            width: 65px; height: 65px; border-radius: 50%;
            background: linear-gradient(135deg, var(--color-1), var(--color-2));
            color: white; display: flex; align-items: center; justify-content: center;
            font-size: 2rem; box-shadow: 0 0 25px rgba(192, 132, 252, 0.5); 
            cursor: pointer; z-index: 100; transition: 0.3s;
        }
        .fab:hover { transform: scale(1.1) rotate(90deg); }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 200; display: none;
            align-items: center; justify-content: center; backdrop-filter: blur(8px);
        }
        .modal-box {
            background: #1e293b; width: 90%; max-width: 400px; padding: 25px;
            border-radius: 24px; box-shadow: 0 0 40px rgba(0,0,0,0.5); border: 1px solid var(--glass-border);
            animation: slideUp 0.3s ease;
        }
        @keyframes slideUp { from { transform: translateY(50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .item-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .hidden { display: none !important; }
        
        .error-msg { 
            background: rgba(239, 68, 68, 0.2); 
            color: #fca5a5; 
            padding: 12px; 
            border-radius: 8px; 
            border: 1px solid #ef4444; 
            margin-bottom: 15px; 
            display: none;
            font-size: 0.95rem;
        }
        
        .success-msg { 
            background: rgba(34, 197, 94, 0.2); 
            color: #86efac; 
            padding: 12px; 
            border-radius: 8px; 
            border: 1px solid #22c55e; 
            margin-bottom: 15px; 
            display: none;
            font-size: 0.95rem;
        }
        
        .link-btn { color: var(--color-2); cursor: pointer; font-weight: 700; text-decoration: underline; }
        .close-btn { float: left; font-size: 1.5rem; cursor: pointer; color: #94a3b8; }
        
        .btn-confirm { background: #ef4444; color: white; border: none; padding: 10px 20px; border-radius: 12px; font-weight: bold; width: 45%; }
        .btn-cancel { background: rgba(255,255,255,0.1); color: white; border: none; padding: 10px 20px; border-radius: 12px; font-weight: bold; width: 45%; }
        
        .modal-label { 
            color: #e2e8f0; font-size: 0.95rem; margin-bottom: 5px; display: block; font-weight: 600;
        }

        .loading-spinner {
            border: 3px solid rgba(255,255,255,0.1);
            border-top: 3px solid var(--color-2);
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
            margin-right: 8px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="loginScreen" class="auth-container">
    <h1 class="glow-text" style="font-size: 3.5rem; line-height: 1.2;">Fitness<br>Pro</h1>
    <p style="color: #94a3b8; font-size: 1.2rem; margin-bottom: 30px;">האנרגיה שלך מתחילה כאן.</p>
    <div id="loginError" class="error-msg"></div>
    <div id="loginSuccess" class="success-msg"></div>
    <input type="email" id="loginEmail" class="input-glass" placeholder="אימייל" dir="ltr">
    <div class="password-wrapper">
        <input type="password" id="loginPass" class="input-glass" placeholder="הסיסמה הסודית..." dir="ltr">
        <i class="bi bi-eye password-toggle" onclick="togglePass('loginPass', this)"></i>
    </div>
    <button onclick="login()" class="btn-glow" id="loginBtn">כניסה למערכת</button>
    <div class="text-center mt-3"><span style="color: #94a3b8;">חדשה?</span> <span onclick="showRegister()" class="link-btn">הרשמה</span></div>
</div>

<div id="registerScreen" class="auth-container hidden">
    <h1 class="glow-text">הצטרפי</h1>
    <p style="color: #94a3b8; margin-bottom: 30px;">התחילי את השינוי היום.</p>
    <div id="regError" class="error-msg"></div>
    <div id="regSuccess" class="success-msg"></div>
    <input type="email" id="regEmail" class="input-glass" placeholder="אימייל" dir="ltr">
    <div class="password-wrapper">
        <input type="password" id="regPass" class="input-glass" placeholder="סיסמה (8+ תווים)" dir="ltr">
        <i class="bi bi-eye password-toggle" onclick="togglePass('regPass', this)"></i>
    </div>
    <button onclick="register()" class="btn-glow" id="regBtn">יצירת חשבון</button>
    <div class="text-center mt-3"><span onclick="showLogin()" class="link-btn">חזרה לכניסה</span></div>
</div>

<div id="appScreen" class="hidden">
    <div class="app-header">
        <div class="glow-text" style="font-size: 1.5rem; margin:0; text-shadow:none;">My Tracker</div>
        <button onclick="logout()" class="btn-logout">יציאה</button>
    </div>

    <div class="progress-container">
        <div class="glow-bg"></div>
        <div class="cal-number" id="totalCalories">0</div>
        <div class="cal-label">קלוריות היום</div>
    </div>

    <div class="meals-grid" id="mealsGrid"></div>
    <div class="fab" onclick="openAddModal()"><i class="bi bi-plus-lg"></i></div>
</div>

<div class="modal-overlay" id="addModal">
    <div class="modal-box">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="m-0 fw-bold text-white">הוספת ארוחה</h4>
            <i class="bi bi-x-lg close-btn" onclick="closeModal('addModal')"></i>
        </div>
        <div id="addError" class="error-msg"></div>
        <label class="modal-label">איזו ארוחה זו?</label>
        <select id="mealType" class="input-glass mb-3" style="padding:10px;">
            <option value="morning" style="color:black">🥐 בוקר</option>
            <option value="noon" style="color:black">🍛 צהריים</option>
            <option value="evening" style="color:black">🥗 ערב</option>
            <option value="snack" style="color:black">🥨 נשנוש</option>
        </select>
        <label class="modal-label">מה אכלת?</label>
        <input type="text" id="foodName" class="input-glass mb-3" placeholder="למשל: יוגורט">
        <label class="modal-label">קלוריות</label>
        <input type="number" id="foodCal" class="input-glass mb-3" placeholder="0" min="1">
        
        <label class="modal-label">🕐 מתי אכלת?</label>
        <div style="display: flex; gap: 10px; margin-bottom: 15px;">
            <label style="flex: 1; cursor: pointer;">
                <input type="radio" name="timeOption" value="now" checked onchange="toggleTimeInput()"> 
                <span style="color: #e2e8f0; margin-right: 5px;">עכשיו</span>
            </label>
            <label style="flex: 1; cursor: pointer;">
                <input type="radio" name="timeOption" value="custom" onchange="toggleTimeInput()"> 
                <span style="color: #e2e8f0; margin-right: 5px;">שעה אחרת</span>
            </label>
        </div>
        <input type="time" id="customTime" class="input-glass mb-4" style="display: none;">
        
        <button onclick="addMeal()" class="btn-glow" id="addMealBtn">שמירה</button>
    </div>
</div>

<div class="modal-overlay" id="viewModal">
    <div class="modal-box">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="m-0 fw-bold text-white" id="viewTitle">ארוחת בוקר</h4>
            <i class="bi bi-x-lg close-btn" onclick="closeModal('viewModal')"></i>
        </div>
        <div id="itemsList" style="max-height: 300px; overflow-y: auto; color: white;"></div>
    </div>
</div>

<div class="modal-overlay" id="confirmModal">
    <div class="modal-box text-center">
        <i class="bi bi-trash3 text-danger" style="font-size: 3rem; margin-bottom: 10px;"></i>
        <h4 class="text-white fw-bold mb-2">למחוק את הארוחה?</h4>
        <p style="color: #94a3b8; margin-bottom: 20px;">הפעולה היא סופית ולא ניתנת לביטול.</p>
        <div class="d-flex justify-content-between">
            <button onclick="closeModal('confirmModal')" class="btn-cancel">ביטול</button>
            <button onclick="performDelete()" class="btn-confirm">מחיקה</button>
        </div>
    </div>
</div>

<script>
    const API_URL = '/api';
    let currentUser = null;
    let allMeals = []; 
    let itemToDeleteId = null;
    let lastKnownDate = new Date().toDateString();

    // פונקציות עזר להצגת הודעות
    function showError(elementId, message) {
        const el = document.getElementById(elementId);
        el.textContent = message;
        el.style.display = 'block';
        setTimeout(() => { el.style.display = 'none'; }, 5000);
    }

    function showSuccess(elementId, message) {
        const el = document.getElementById(elementId);
        el.textContent = message;
        el.style.display = 'block';
        setTimeout(() => { el.style.display = 'none'; }, 3000);
    }

    function hideMessages() {
        document.querySelectorAll('.error-msg, .success-msg').forEach(el => {
            el.style.display = 'none';
        });
    }

    // Validation פונקציות
    function isValidEmail(email) {
        const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        return re.test(email);
    }

    function isValidPassword(password) {
        return password && password.length >= 8;
    }

    function togglePass(inputId, icon) {
        const input = document.getElementById(inputId);
        if (input.type === "password") {
            input.type = "text"; 
            icon.classList.remove("bi-eye"); 
            icon.classList.add("bi-eye-slash");
        } else {
            input.type = "password"; 
            icon.classList.remove("bi-eye-slash"); 
            icon.classList.add("bi-eye");
        }
    }

    // פונקציה חכמה לקביעת ארוחה ברירת מחדל לפי השעה
    function getDefaultMealType() {
        const hour = new Date().getHours();
        
        // 9:00-11:00 → בוקר
        if (hour >= 9 && hour < 11) return 'morning';
        
        // 15:00-17:00 (3-5 אחה"צ) → צהריים
        if (hour >= 15 && hour < 17) return 'noon';
        
        // 19:00-21:00 (7-9 ערב) → ערב
        if (hour >= 19 && hour < 21) return 'evening';
        
        // שאר הזמן → נשנוש
        return 'snack';
    }

    function init() {
        try {
            const savedUser = localStorage.getItem('dietUser');
            if (savedUser) { 
                currentUser = JSON.parse(savedUser); 
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('appScreen').classList.remove('hidden');
                loadData(); 
                
                // בדיקה כל דקה אם עבר יום (במקום 10 שניות)
                setInterval(() => {
                    if (new Date().toDateString() !== lastKnownDate) {
                        location.reload();
                    }
                }, 60000); // 1 דקה
            }
        } catch(e) {
            console.error('Error initializing:', e);
            localStorage.removeItem('dietUser');
        }
    }

    async function login() {
        hideMessages();
        const email = document.getElementById('loginEmail').value.trim();
        const pass = document.getElementById('loginPass').value;
        const btn = document.getElementById('loginBtn');
        
        // Validation
        if (!email || !pass) {
            showError('loginError', 'נא למלא את כל השדות');
            return;
        }
        
        if (!isValidEmail(email)) {
            showError('loginError', 'כתובת אימייל לא תקינה');
            return;
        }
        
        // Loading state
        btn.disabled = true;
        btn.innerHTML = '<span class="loading-spinner"></span>מתחבר...';
        
        try {
            const res = await fetch(`${API_URL}/auth/login`, {
                method: 'POST', 
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ email, password: pass })
            });
            
            if (res.ok) {
                const data = await res.json();
                currentUser = { id: data.userId, email: data.email };
                localStorage.setItem('dietUser', JSON.stringify(currentUser));
                showSuccess('loginSuccess', 'התחברת בהצלחה!');
                setTimeout(() => location.reload(), 1000);
            } else {
                const error = await res.json();
                showError('loginError', error.message || 'שגיאה בהתחברות. אנא בדקי את הפרטים.');
            }
        } catch (error) {
            console.error('Login error:', error);
            showError('loginError', 'שגיאת רשת. אנא נסי שוב.');
        } finally {
            btn.disabled = false;
            btn.innerHTML = 'כניסה למערכת';
        }
    }

    async function register() {
        hideMessages();
        const email = document.getElementById('regEmail').value.trim();
        const pass = document.getElementById('regPass').value;
        const btn = document.getElementById('regBtn');
        
        // Validation
        if (!email || !pass) {
            showError('regError', 'נא למלא את כל השדות');
            return;
        }
        
        if (!isValidEmail(email)) {
            showError('regError', 'כתובת אימייל לא תקינה');
            return;
        }
        
        if (!isValidPassword(pass)) {
            showError('regError', 'הסיסמה חייבת להכיל לפחות 8 תווים');
            return;
        }
        
        // Loading state
        btn.disabled = true;
        btn.innerHTML = '<span class="loading-spinner"></span>יוצר חשבון...';
        
        try {
            const res = await fetch(`${API_URL}/auth/register`, {
                method: 'POST', 
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ email, password: pass })
            });
            
            if (res.ok) {
                showSuccess('regSuccess', 'החשבון נוצר בהצלחה! מעביר להתחברות...');
                setTimeout(() => showLogin(), 2000);
            } else {
                const error = await res.json();
                showError('regError', error.message || 'שגיאה ביצירת חשבון. אולי המשתמש כבר קיים?');
            }
        } catch (error) {
            console.error('Register error:', error);
            showError('regError', 'שגיאת רשת. אנא נסי שוב.');
        } finally {
            btn.disabled = false;
            btn.innerHTML = 'יצירת חשבון';
        }
    }

    function showLogin() { 
        hideAll(); 
        hideMessages();
        document.getElementById('loginScreen').classList.remove('hidden'); 
    }
    
    function showRegister() { 
        hideAll(); 
        hideMessages();
        document.getElementById('registerScreen').classList.remove('hidden'); 
    }
    
    function hideAll() { 
        document.getElementById('loginScreen').classList.add('hidden'); 
        document.getElementById('registerScreen').classList.add('hidden'); 
        document.getElementById('appScreen').classList.add('hidden'); 
    }
    
    function logout() { 
        if (confirm('בטוחה שאת רוצה להתנתק?')) {
            localStorage.removeItem('dietUser'); 
            location.reload(); 
        }
    }
    
    function closeModal(id) { 
        document.getElementById(id).style.display = 'none'; 
        
        // ניקוי טופס אם סוגרים את מודל ההוספה
        if(id === 'addModal') {
            document.getElementById('foodName').value = '';
            document.getElementById('foodCal').value = '';
            hideMessages();
        }
    }
    
    function openAddModal() { 
        // קביעת ברירת מחדל חכמה לפי השעה
        document.getElementById('mealType').value = getDefaultMealType();
        
        // איפוס בחירת זמן
        document.querySelector('input[name="timeOption"][value="now"]').checked = true;
        document.getElementById('customTime').style.display = 'none';
        document.getElementById('customTime').value = '';
        
        document.getElementById('addModal').style.display = 'flex'; 
    }

    function toggleTimeInput() {
        const customTimeInput = document.getElementById('customTime');
        const isCustom = document.querySelector('input[name="timeOption"][value="custom"]').checked;
        
        if (isCustom) {
            customTimeInput.style.display = 'block';
            // הגדרת ברירת מחדל לשעה הנוכחית
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            customTimeInput.value = `${hours}:${minutes}`;
        } else {
            customTimeInput.style.display = 'none';
        }
    }

    async function loadData() {
        if (!currentUser) return;
        
        try {
            const resMeals = await fetch(`${API_URL}/meals?userId=${currentUser.id}`);
            
            if (!resMeals.ok) {
                throw new Error('Failed to load meals');
            }
            
            allMeals = await resMeals.json();
            renderGrid();
        } catch (error) {
            console.error('Error loading data:', error);
            // אפשר להציג הודעת שגיאה למשתמש כאן
        }
    }

    function renderGrid() {
        const todayStr = new Date().toDateString();
        const todaysMeals = allMeals.filter(m => new Date(m.date).toDateString() === todayStr);
        document.getElementById('totalCalories').innerText = todaysMeals.reduce((sum, m) => sum + m.calories, 0);

        const categories = {
            morning: { title: 'בוקר', icon: '🥐', cal: 0, items: [], css: 'border-morning' },
            noon:    { title: 'צהריים', icon: '🍛', cal: 0, items: [], css: 'border-noon' },
            evening: { title: 'ערב', icon: '🥗', cal: 0, items: [], css: 'border-evening' },
            snack:   { title: 'נשנוש', icon: '🥨', cal: 0, items: [], css: 'border-snack' }
        };

        todaysMeals.forEach(m => {
            // שימוש ב-mealType שנשמר במסד הנתונים
            let key = m.mealType || 'snack'; // ברירת מחדל: נשנוש אם אין mealType
            
            if(categories[key]) {
                categories[key].cal += m.calories;
                categories[key].items.push(m);
            }
        });

        const grid = document.getElementById('mealsGrid');
        grid.innerHTML = '';
        for (const key in categories) {
            const cat = categories[key];
            grid.innerHTML += `
                <div class="meal-card ${cat.css}" onclick="showCategoryDetails('${key}')">
                    <div class="card-icon">${cat.icon}</div>
                    <div class="card-title">${cat.title}</div>
                    <div class="card-cal">${cat.cal}</div>
                    <div class="card-sub">${cat.items.length} פריטים</div>
                </div>`;
        }
    }

    function showCategoryDetails(key) {
        const titles = { 
            morning: 'ארוחת בוקר', 
            noon: 'ארוחת צהריים', 
            evening: 'ארוחת ערב', 
            snack: 'נשנושים' 
        };
        
        document.getElementById('viewTitle').innerText = titles[key];
        const todayStr = new Date().toDateString();
        
        // סינון לפי mealType במקום לפי שעה
        const items = allMeals.filter(m => {
            if (new Date(m.date).toDateString() !== todayStr) return false;
            return (m.mealType || 'snack') === key;
        });

        const list = document.getElementById('itemsList');
        
        if (items.length === 0) {
            list.innerHTML = '<p style="text-align:center; color:#94a3b8; padding:20px;">אין פריטים עדיין</p>';
        } else {
            list.innerHTML = '';
            items.forEach(m => {
                const time = new Date(m.date).toLocaleTimeString('he-IL', {hour:'2-digit', minute:'2-digit'});
                list.innerHTML += `
                    <div class="item-row">
                        <div><b>${m.name}</b><br><small style="color:#94a3b8">${time}</small></div>
                        <div class="d-flex align-items-center gap-2">
                            <span style="font-weight:700">${m.calories}</span>
                            <i class="bi bi-trash text-danger" style="cursor:pointer" onclick="confirmDelete(${m.id})"></i>
                        </div>
                    </div>`;
            });
        }
        
        document.getElementById('viewModal').style.display = 'flex';
    }

   async function addMeal() {
        const name = document.getElementById('foodName').value;
        const calories = parseInt(document.getElementById('foodCal').value);
        const type = document.getElementById('mealType').value;
        const btn = document.getElementById('addMealBtn'); // השם הנכון של הכפתור

        if (!name || !calories) {
            const errorDiv = document.getElementById('addError');
            if(errorDiv) {
                errorDiv.innerText = 'מלאי את כל השדות';
                errorDiv.style.display = 'block';
            }
            return;
        }

        if (btn) {
            btn.disabled = true; 
            btn.innerHTML = '<span class="loading-spinner"></span> שומר...';
        }

        let date = new Date(); // לוקח את הזמן של עכשיו (15:02)
        
        // בדיקת שעה מותאמת אישית
        const customTimeInput = document.getElementById('customTime');
        if (customTimeInput && customTimeInput.style.display !== 'none' && customTimeInput.value) {
            const [h, m] = customTimeInput.value.split(':');
            date.setHours(h, m, 0, 0);
        }

        // --- התיקון: בלי חישובים מתמטיים ---
        // פשוט שולחים את התאריך כמו שהוא בפורמט בינלאומי.
        // המחשב ישלח "13:02" (זמן עולמי), וכשהאפליקציה תציג את זה,
        // היא תהפוך את זה חזרה אוטומטית ל-"15:02" (זמן ישראל).
        const dateStr = date.toISOString(); 

        const mealData = { 
            name, 
            calories, 
            userId: currentUser.id, 
            date: dateStr, 
            mealType: type 
        };

        try {
            const res = await fetch(`${API_URL}/meals`, {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(mealData)
            });
            
            if (res.ok) { 
                closeModal('addModal'); 
                loadData(); 
            } else {
                console.error('Save failed');
            }
        } catch(e) {
            console.error(e);
        } finally { 
            if (btn) {
                btn.disabled = false; 
                btn.innerHTML = 'שמירה';
            }
        }
    }

    function confirmDelete(id) { 
        itemToDeleteId = id; 
        document.getElementById('confirmModal').style.display = 'flex'; 
    }
    
    async function performDelete() {
        if(!itemToDeleteId) return;
        
        try {
            const res = await fetch(`${API_URL}/meals/${itemToDeleteId}`, { 
                method: 'DELETE' 
            });
            
            if (res.ok) {
                closeModal('confirmModal'); 
                closeModal('viewModal');
                await loadData(); // רענון הנתונים
            } else {
                console.error('Failed to delete meal');
            }
        } catch (error) {
            console.error('Error deleting meal:', error);
        }
    }
    
    window.showRegister = showRegister; 
    window.showLogin = showLogin;
    window.toggleTimeInput = toggleTimeInput;
    init();
</script>
</body>
</html>
