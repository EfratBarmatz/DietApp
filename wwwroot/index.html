<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pastel Calm Diet</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌸</text></svg>">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #1a1b26; /* רקע כהה רך יותר */
            /* פלטת פסטל ניאון חדשה */
            --pastel-mint: #81eba9;
            --pastel-lavender: #a79bf2;
            --pastel-peach: #f2a69b;
            --pastel-sky: #89ddf0;
        }

        body {
            font-family: 'Assistant', system-ui, sans-serif;
            background-color: var(--bg-dark);
            color: #e2e8f0;
            margin: 0; min-height: 100vh;
            display: flex; flex-direction: column;
            overflow-x: hidden;
        }

        /* טקסט כותרת פסטל */
        .pastel-text {
            font-weight: 800;
            background: linear-gradient(to right, var(--pastel-mint), var(--pastel-sky));
            -webkit-background-clip: text; background-clip: text; color: transparent;
            text-shadow: 0 0 30px rgba(129, 235, 169, 0.3);
            margin-bottom: 10px;
        }

        /* --- משותף --- */
        .auth-container { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 30px; max-width: 400px; margin: 0 auto; width: 100%; }
        .input-dark {
            background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255,255,255,0.1); color: white;
            border-radius: 20px; padding: 15px; font-size: 1.1rem; width: 100%; margin-bottom: 15px; backdrop-filter: blur(10px); transition: 0.3s;
        }
        .input-dark:focus { outline: none; border-color: var(--pastel-mint); box-shadow: 0 0 20px rgba(129, 235, 169, 0.2); }

        .btn-pastel {
            background: linear-gradient(135deg, var(--pastel-mint), #5cdb8e);
            color: #1a1b26; font-weight: 800; padding: 15px; border-radius: 20px; border: none; width: 100%; font-size: 1.2rem;
            box-shadow: 0 5px 20px rgba(129, 235, 169, 0.3); margin-top: 10px; cursor: pointer; transition: 0.2s;
        }
        .btn-pastel:hover { transform: translateY(-3px); box-shadow: 0 10px 30px rgba(129, 235, 169, 0.5); }

        .app-header {
            padding: 20px 25px; display: flex; justify-content: space-between; align-items: center;
            background: transparent; position: sticky; top: 0; z-index: 10;
        }
        .btn-logout { background: rgba(255,255,255,0.1); border: none; color: white; border-radius: 50px; padding: 8px 20px; font-size: 0.9rem; }

        /* מד קלוריות פסטל */
        .progress-container { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px 0 50px; position: relative; }
        .glow-bg { position: absolute; width: 240px; height: 240px; border-radius: 50%; background: radial-gradient(circle, rgba(129, 235, 169, 0.15) 0%, rgba(26,27,38,0) 70%); animation: pulse 5s infinite ease-in-out; z-index: 0; }
        @keyframes pulse { 0% { transform: scale(1); opacity: 0.6; } 50% { transform: scale(1.1); opacity: 0.9; } 100% { transform: scale(1); opacity: 0.6; } }
        .cal-number { font-size: 5rem; font-weight: 900; line-height: 1; z-index: 1; background: linear-gradient(to bottom, #ffffff, #cce0ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .cal-label { color: var(--pastel-mint); font-weight: 700; letter-spacing: 2px; margin-top: 10px; z-index: 1; text-transform: uppercase; font-size: 0.9rem; opacity: 0.8; }

        /* --- עיצוב הבלוקים החדש (במקום רשימה) --- */
        .meals-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 15px;
            padding: 0 25px 100px; /* מרווח למטה לכפתור הצף */
        }

        .meal-block {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 24px; padding: 20px;
            display: flex; flex-direction: column;
            transition: 0.3s; position: relative; overflow: hidden;
        }
        .meal-block:hover { background: rgba(255, 255, 255, 0.06); transform: translateY(-5px); }
        
        /* צבעים שונים לכל שעה */
        .block-morning { border-bottom: 4px solid var(--pastel-mint); }
        .block-noon { border-bottom: 4px solid var(--pastel-sky); }
        .block-evening { border-bottom: 4px solid var(--pastel-lavender); }
        .block-snack { border-bottom: 4px solid var(--pastel-peach); }

        .block-icon { font-size: 1.8rem; margin-bottom: 10px; opacity: 0.8; }
        .block-title { font-weight: 700; font-size: 1.1rem; margin-bottom: 5px; }
        .block-cal { font-size: 1.6rem; font-weight: 900; color: white; }
        .block-count { font-size: 0.9rem; opacity: 0.6; }
        .empty-block { opacity: 0.4; }

        /* --- כפתור הוספה צף (FAB) --- */
        .fab-btn {
            position: fixed; bottom: 30px; left: 30px;
            width: 65px; height: 65px; border-radius: 50%;
            background: var(--pastel-mint); color: var(--bg-dark);
            border: none; display: flex; align-items: center; justify-content: center;
            font-size: 2rem; box-shadow: 0 10px 30px rgba(129, 235, 169, 0.4);
            cursor: pointer; transition: 0.3s; z-index: 100;
        }
        .fab-btn:hover { transform: scale(1.1) rotate(90deg); background: #9affc1; }

        /* --- חלונית הוספה (Modal) --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(26, 27, 38, 0.9); backdrop-filter: blur(15px);
            z-index: 200; display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: 0.3s;
        }
        .modal-overlay.active { opacity: 1; pointer-events: all; }
        
        .modal-content {
            background: rgba(40, 42, 54, 0.9); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 30px; padding: 30px; width: 90%; max-width: 400px;
            transform: translateY(50px); transition: 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .modal-overlay.active .modal-content { transform: translateY(0); }
        .close-modal { position: absolute; top: 20px; left: 20px; font-size: 1.5rem; cursor: pointer; opacity: 0.6; }

        /* עזרים */
        .password-wrapper { position: relative; width: 100%; }
        .password-toggle { position: absolute; left: 15px; top: 18px; color: #94a3b8; cursor: pointer; }
        .hidden { display: none !important; }
        .error-msg { background: rgba(242, 166, 155, 0.2); color: var(--pastel-peach); padding: 15px; border-radius: 15px; border: 1px solid var(--pastel-peach); margin-bottom: 20px; display: none; }
        .link-btn { color: var(--pastel-lavender); cursor: pointer; font-weight: 700; text-decoration: underline; }
    </style>
</head>
<body>

<div id="loginScreen" class="auth-container">
    <h1 class="pastel-text" style="font-size: 3.5rem; line-height: 1.2;">Calm<br>Diet</h1>
    <p style="color: #a0a0a0; font-size: 1.2rem; margin-bottom: 30px;">איזון עדין.</p>
    <div id="loginError" class="error-msg"></div>
    <input type="email" id="loginEmail" class="input-dark" placeholder="אימייל" dir="ltr">
    <div class="password-wrapper">
        <input type="password" id="loginPass" class="input-dark" placeholder="סיסמה..." dir="ltr">
        <i class="bi bi-eye password-toggle" onclick="togglePass('loginPass', this)"></i>
    </div>
    <button onclick="login()" class="btn-pastel">כניסה</button>
    <div class="text-center mt-4"><span style="color: #a0a0a0;">חדשה?</span> <span onclick="showRegister()" class="link-btn">הרשמה</span></div>
</div>

<div id="registerScreen" class="auth-container hidden">
    <h1 class="pastel-text">הצטרפות</h1>
    <div id="regError" class="error-msg"></div>
    <input type="email" id="regEmail" class="input-dark" placeholder="אימייל" dir="ltr">
    <div class="password-wrapper">
        <input type="password" id="regPass" class="input-dark" placeholder="סיסמה (8+ תווים)" dir="ltr">
        <i class="bi bi-eye password-toggle" onclick="togglePass('regPass', this)"></i>
    </div>
    <button onclick="register()" class="btn-pastel">יצירת חשבון</button>
    <div class="text-center mt-4"><span onclick="showLogin()" class="link-btn">יש לי חשבון</span></div>
</div>

<div id="appScreen" class="hidden">
    <div class="app-header">
        <div class="pastel-text" style="font-size: 1.5rem; margin:0; text-shadow:none;">היום שלי</div>
        <button onclick="logout()" class="btn-logout">יציאה</button>
    </div>

    <div class="progress-container">
        <div class="glow-bg"></div>
        <div class="cal-number" id="totalCalories">0</div>
        <div class="cal-label">קלוריות היום</div>
    </div>

    <div class="meals-grid" id="mealsGrid"></div>

    <button class="fab-btn" onclick="openModal()"><i class="bi bi-plus-lg"></i></button>
</div>

<div class="modal-overlay" id="addModal">
    <div class="modal-content">
        <i class="bi bi-x-lg close-modal" onclick="closeModal()"></i>
        <h3 class="pastel-text text-center mb-4">הוספת משהו טעים</h3>
        <input type="text" id="foodName" class="input-dark" placeholder="מה אכלת? 🥑">
        <input type="number" id="foodCal" class="input-dark" placeholder="כמה קלוריות?">
        <button onclick="addMeal()" class="btn-pastel mt-3">הוספה ליומן</button>
    </div>
</div>

<script>
    const API_URL = '/api';
    let currentUser = null;

    // --- ממשק משתמש ---
    function togglePass(inputId, icon) {
        const input = document.getElementById(inputId);
        input.type = input.type === "password" ? "text" : "password";
        icon.classList.toggle("bi-eye"); icon.classList.toggle("bi-eye-slash");
    }
    function showError(elementId, msg) { const el = document.getElementById(elementId); el.innerText = msg; el.style.display = 'block'; }
    function clearErrors() { document.getElementById('loginError').style.display = 'none'; document.getElementById('regError').style.display = 'none'; }
    
    // --- מודל הוספה ---
    function openModal() { document.getElementById('addModal').classList.add('active'); }
    function closeModal() { document.getElementById('addModal').classList.remove('active'); }

    // --- ניווט ואתחול ---
    function init() {
        try {
            const savedUser = localStorage.getItem('dietUser');
            if (savedUser) { 
                currentUser = JSON.parse(savedUser); 
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('appScreen').classList.remove('hidden');
                loadData(); 
            }
        } catch(e) { console.log(e); }
    }
    function showLogin() { clearErrors(); hideAll(); document.getElementById('loginScreen').classList.remove('hidden'); }
    function showRegister() { clearErrors(); hideAll(); document.getElementById('registerScreen').classList.remove('hidden'); }
    function showApp() { hideAll(); document.getElementById('appScreen').classList.remove('hidden'); loadData(); }
    function hideAll() { document.getElementById('loginScreen').classList.add('hidden'); document.getElementById('registerScreen').classList.add('hidden'); document.getElementById('appScreen').classList.add('hidden'); }
    function logout() { localStorage.removeItem('dietUser'); currentUser = null; showLogin(); }

    // --- לוגיקה (Auth) ---
    async function register() {
        clearErrors();
        const email = document.getElementById('regEmail').value; const pass = document.getElementById('regPass').value;
        if(!email || !pass) return showError('regError', 'חסרים פרטים');
        try {
            const res = await fetch(`${API_URL}/auth/register`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ email, password: pass }) });
            if (res.ok) { alert('נרשמת בהצלחה!'); showLogin(); } else { showError('regError', await res.text()); }
        } catch(e) { showError('regError', 'שגיאת תקשורת'); }
    }

    async function login() {
        clearErrors();
        const email = document.getElementById('loginEmail').value; const pass = document.getElementById('loginPass').value;
        if(!email || !pass) return showError('loginError', 'נא למלא פרטים');
        try {
            const res = await fetch(`${API_URL}/auth/login`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ email, password: pass }) });
            if (res.ok) {
                const data = await res.json();
                currentUser = { id: data.userId, email: data.email };
                localStorage.setItem('dietUser', JSON.stringify(currentUser));
                showApp();
            } else { showError('loginError', 'פרטים שגויים'); }
        } catch(e) { showError('loginError', 'שגיאת תקשורת'); }
    }

    // --- לוגיקה (Data - החלק החדש של הבלוקים!) ---
    async function loadData() {
        if (!currentUser) return;
        
        // טעינת סך הכל
        try {
            const resStats = await fetch(`${API_URL}/stats?userId=${currentUser.id}`);
            const dataStats = await resStats.json();
            document.getElementById('totalCalories').innerText = dataStats.dailyCalories || 0;
        } catch(e) {}

        // טעינת ארוחות וסידור בבלוקים
        try {
            const resMeals = await fetch(`${API_URL}/meals?userId=${currentUser.id}`);
            const meals = await resMeals.json();
            renderMealBlocks(meals);
        } catch(e) {}
    }

    function renderMealBlocks(meals) {
        const grid = document.getElementById('mealsGrid');
        grid.innerHTML = '';

        // אתחול קבוצות
        const slots = {
            morning: { title: 'בוקר טוב', icon: 'bi-sunrise', cal: 0, count: 0, css: 'block-morning' },
            noon:    { title: 'צהריים', icon: 'bi-sun', cal: 0, count: 0, css: 'block-noon' },
            evening: { title: 'ערב רגוע', icon: 'bi-moon-stars', cal: 0, count: 0, css: 'block-evening' },
            snack:   { title: 'נשנושים', icon: 'bi-cookie', cal: 0, count: 0, css: 'block-snack' }
        };

        // מיון הארוחות לקבוצות לפי שעה
        meals.forEach(m => {
            const hour = new Date(m.date).getHours();
            let slotKey = 'snack';
            if (hour >= 5 && hour < 12) slotKey = 'morning';
            else if (hour >= 12 && hour < 17) slotKey = 'noon';
            else if (hour >= 17 && hour < 22) slotKey = 'evening';
            
            slots[slotKey].cal += m.calories;
            slots[slotKey].count++;
        });

        // יצירת הבלוקים ב-HTML
        for (const key in slots) {
            const s = slots[key];
            const isEmpty = s.count === 0;
            grid.innerHTML += `
                <div class="meal-block ${s.css} ${isEmpty ? 'empty-block' : ''}">
                    <i class="bi ${s.icon} block-icon" style="color: var(--pastel-${key === 'morning' ? 'mint' : key === 'noon' ? 'sky' : key === 'evening' ? 'lavender' : 'peach'})"></i>
                    <div class="block-title">${s.title}</div>
                    <div class="block-cal">${s.cal > 0 ? s.cal : '-'}</div>
                    <div class="block-count">${s.count > 0 ? s.count + ' פריטים' : 'ריק'}</div>
                </div>`;
        }
    }

    async function addMeal() {
        const name = document.getElementById('foodName');
        const cal = document.getElementById('foodCal');
        if(!name.value || !cal.value) return;
        
        const localTime = (new Date(new Date() - new Date().getTimezoneOffset() * 60000)).toISOString().slice(0, -1);
        try {
            await fetch(`${API_URL}/meals`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ name: name.value, calories: parseInt(cal.value), date: localTime, userId: currentUser.id }) });
            name.value = ''; cal.value = '';
            closeModal(); // סגירת החלונית
            loadData();
        } catch(e) {}
    }

    init();
</script>
</body>
</html>
