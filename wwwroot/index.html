<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Pro Diet</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍏</text></svg>">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --neon-green: #4ade80;
            --neon-blue: #60a5fa;
            --neon-purple: #c084fc;
        }

        body {
            /* כאן הסוד: מנסה את הפונט היפה, ואם נחסם - עובר לרגיל */
            font-family: 'Assistant', system-ui, sans-serif;
            background-color: var(--bg-dark);
            color: #f8fafc;
            margin: 0; min-height: 100vh;
            display: flex; flex-direction: column;
            overflow-x: hidden;
        }

        /* --- הטקסט השקוף והזוהר שרצית --- */
        .neon-text {
            font-weight: 900;
            background: linear-gradient(to right, var(--neon-green), var(--neon-blue));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent; /* הופך את הטקסט לשקוף כדי שהרקע יבלוט */
            text-shadow: 0 0 40px rgba(74, 222, 128, 0.3); /* הילה זוהרת */
            letter-spacing: -1px;
            margin-bottom: 10px;
        }

        /* --- כניסה והרשמה --- */
        .auth-container {
            flex: 1; display: flex; flex-direction: column; justify-content: center;
            padding: 30px; max-width: 400px; margin: 0 auto; width: 100%;
        }
        
        .input-dark {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid #334155; color: white;
            border-radius: 15px; padding: 15px; font-size: 1.1rem; width: 100%;
            margin-bottom: 15px; transition: 0.3s;
            backdrop-filter: blur(5px);
        }
        .input-dark:focus { outline: none; border-color: var(--neon-green); box-shadow: 0 0 20px rgba(74, 222, 128, 0.3); }

        .btn-neon {
            background: linear-gradient(135deg, var(--neon-green), #22c55e);
            color: #000; font-weight: 800; padding: 15px;
            border-radius: 15px; border: none; width: 100%; font-size: 1.2rem;
            box-shadow: 0 0 25px rgba(34, 197, 94, 0.4); margin-top: 10px;
            transition: 0.2s; cursor: pointer;
        }
        .btn-neon:hover { transform: scale(1.02); box-shadow: 0 0 40px rgba(34, 197, 94, 0.6); }

        /* --- דשבורד --- */
        .app-header {
            padding: 15px 20px; display: flex; justify-content: space-between; align-items: center;
            background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(10px);
            position: sticky; top: 0; z-index: 10; border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        
        .btn-logout {
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white;
            border-radius: 50px; padding: 5px 15px; font-size: 0.9rem;
        }

        .progress-container {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 40px 0; position: relative;
        }
        
        .glow-bg {
            position: absolute; width: 220px; height: 220px; border-radius: 50%;
            background: radial-gradient(circle, rgba(74, 222, 128, 0.15) 0%, rgba(15,23,42,0) 70%);
            animation: pulse 4s infinite ease-in-out;
            z-index: 0;
        }
        @keyframes pulse { 0% { transform: scale(1); opacity: 0.5; } 50% { transform: scale(1.1); opacity: 0.8; } 100% { transform: scale(1); opacity: 0.5; } }
        
        .cal-number { 
            font-size: 4.5rem; font-weight: 900; line-height: 1; z-index: 1;
            /* גם המספרים שקופים וזוהרים */
            background: linear-gradient(to bottom, #ffffff, #94a3b8);
            -webkit-background-clip: text; background-clip: text; color: transparent;
        }
        .cal-label { color: var(--neon-green); font-weight: bold; letter-spacing: 2px; margin-top: 5px; z-index: 1; text-transform: uppercase; font-size: 0.9rem; }

        .meals-list { padding: 0 20px 100px 20px; } 
        
        .meal-card {
            background: rgba(30, 41, 59, 0.6); border: 1px solid rgba(255,255,255,0.05);
            border-right: 4px solid var(--neon-purple);
            border-radius: 16px; padding: 15px; margin-bottom: 12px;
            display: flex; justify-content: space-between; align-items: center;
            backdrop-filter: blur(5px);
        }

        .bottom-bar {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: rgba(15, 23, 42, 0.9); padding: 15px 20px;
            border-top: 1px solid rgba(255,255,255,0.1); display: flex; gap: 10px;
            backdrop-filter: blur(10px);
        }
        
        .input-bar { background: #1e293b; border: 1px solid #334155; color: white; border-radius: 50px; padding: 12px 20px; flex-grow: 1; outline: none; }
        .btn-plus {
            background: var(--neon-green); color: black; border: none; width: 50px; height: 50px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.5rem;
            box-shadow: 0 0 15px rgba(74, 222, 128, 0.5);
        }
        
        .password-wrapper { position: relative; width: 100%; }
        .password-toggle { position: absolute; left: 15px; top: 18px; color: #94a3b8; cursor: pointer; }
        .hidden { display: none !important; }
        .error-msg { background: rgba(239, 68, 68, 0.2); color: #fca5a5; padding: 10px; border-radius: 8px; border: 1px solid #ef4444; margin-bottom: 15px; display: none; }
        .link-btn { color: var(--neon-purple); cursor: pointer; font-weight: bold; text-decoration: underline; }
    </style>
</head>
<body>

<div id="loginScreen" class="auth-container">
    <h1 class="neon-text" style="font-size: 3.5rem; line-height: 1.2;">Fitness<br>Pro</h1>
    <p style="color: #94a3b8; font-size: 1.2rem; margin-bottom: 30px;">היכנסי לקצב.</p>
    
    <div id="loginError" class="error-msg"></div>

    <input type="email" id="loginEmail" class="input-dark" placeholder="אימייל" dir="ltr">
    
    <div class="password-wrapper">
        <input type="password" id="loginPass" class="input-dark" placeholder="הסיסמה הסודית..." dir="ltr">
        <i class="bi bi-eye password-toggle" onclick="togglePass('loginPass', this)"></i>
    </div>

    <button onclick="login()" class="btn-neon">כניסה למערכת</button>
    <div class="text-center mt-3">
        <span style="color: #94a3b8;">חדשה כאן?</span> 
        <span onclick="showRegister()" class="link-btn">הרשמה</span>
    </div>
</div>

<div id="registerScreen" class="auth-container hidden">
    <h1 class="neon-text">הצטרפי</h1>
    <p style="color: #94a3b8; margin-bottom: 30px;">התחילי את השינוי היום.</p>
    
    <div id="regError" class="error-msg"></div>

    <input type="email" id="regEmail" class="input-dark" placeholder="אימייל" dir="ltr">
    
    <div class="password-wrapper">
        <input type="password" id="regPass" class="input-dark" placeholder="סיסמה (8+ תווים)" dir="ltr">
        <i class="bi bi-eye password-toggle" onclick="togglePass('regPass', this)"></i>
    </div>

    <button onclick="register()" class="btn-neon">יצירת חשבון</button>
    <div class="text-center mt-3">
        <span onclick="showLogin()" class="link-btn">חזרה לכניסה</span>
    </div>
</div>

<div id="appScreen" class="hidden">
    <div class="app-header">
        <div class="neon-text" style="font-size: 1.5rem; text-shadow:none; margin:0;">My Tracker</div>
        <button onclick="logout()" class="btn-logout">יציאה</button>
    </div>

    <div class="progress-container">
        <div class="glow-bg"></div>
        <div class="cal-number" id="totalCalories">0</div>
        <div class="cal-label">קלוריות היום</div>
    </div>

    <div class="meals-list" id="mealsList"></div>

    <div class="bottom-bar">
        <input type="text" id="foodName" class="input-bar" placeholder="מה אכלת?">
        <input type="number" id="foodCal" class="input-bar" placeholder="קל'" style="width: 80px; text-align:center;">
        <button onclick="addMeal()" class="btn-plus"><i class="bi bi-plus-lg"></i></button>
    </div>
</div>

<script>
    const API_URL = '/api';
    let currentUser = null;

    function togglePass(inputId, icon) {
        const input = document.getElementById(inputId);
        input.type = input.type === "password" ? "text" : "password";
        icon.classList.toggle("bi-eye");
        icon.classList.toggle("bi-eye-slash");
    }

    function showError(elementId, msg) { const el = document.getElementById(elementId); el.innerText = msg; el.style.display = 'block'; }
    function clearErrors() { document.getElementById('loginError').style.display = 'none'; document.getElementById('regError').style.display = 'none'; }

    function showLogin() { clearErrors(); hideAll(); document.getElementById('loginScreen').classList.remove('hidden'); }
    function showRegister() { clearErrors(); hideAll(); document.getElementById('registerScreen').classList.remove('hidden'); }
    function showApp() { hideAll(); document.getElementById('appScreen').classList.remove('hidden'); loadData(); }
    
    function hideAll() { 
        document.getElementById('loginScreen').classList.add('hidden'); 
        document.getElementById('registerScreen').classList.add('hidden'); 
        document.getElementById('appScreen').classList.add('hidden'); 
    }

    function init() {
        try {
            const savedUser = localStorage.getItem('dietUser');
            if (savedUser) { 
                currentUser = JSON.parse(savedUser); 
                // ידנית מסתיר את הכניסה ומציג את האפליקציה אם המשתמש מחובר
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('appScreen').classList.remove('hidden');
                loadData(); 
            }
        } catch(e) { 
            // אם יש שגיאה, הוא פשוט יישאר במסך הכניסה שכבר מוצג
            console.log(e); 
        }
    }

    async function register() {
        clearErrors();
        const email = document.getElementById('regEmail').value; const pass = document.getElementById('regPass').value;
        if(!email || !pass) return showError('regError', 'חסרים פרטים');
        try {
            const res = await fetch(`${API_URL}/auth/register`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ email, password: pass }) });
            if (res.ok) { alert('נרשמת בהצלחה!'); showLogin(); } else { showError('regError', await res.text()); }
        } catch(e) { showError('regError', 'שגיאת תקשורת'); }
    }

    async function login() {
        clearErrors();
        const email = document.getElementById('loginEmail').value; const pass = document.getElementById('loginPass').value;
        if(!email || !pass) return showError('loginError', 'נא למלא פרטים');
        try {
            const res = await fetch(`${API_URL}/auth/login`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ email, password: pass }) });
            if (res.ok) {
                const data = await res.json();
                currentUser = { id: data.userId, email: data.email };
                localStorage.setItem('dietUser', JSON.stringify(currentUser));
                showApp();
            } else { showError('loginError', 'פרטים שגויים'); }
        } catch(e) { showError('loginError', 'שגיאת תקשורת'); }
    }

    function logout() { localStorage.removeItem('dietUser'); currentUser = null; showLogin(); }

    async function loadData() {
        if (!currentUser) return;
        try {
            const resStats = await fetch(`${API_URL}/stats?userId=${currentUser.id}`);
            const dataStats = await resStats.json();
            document.getElementById('totalCalories').innerText = dataStats.dailyCalories || 0;
        } catch(e) {}

        try {
            const resMeals = await fetch(`${API_URL}/meals?userId=${currentUser.id}`);
            const meals = await resMeals.json();
            const list = document.getElementById('mealsList');
            list.innerHTML = '';
            meals.forEach(m => {
                const time = new Date(m.date).toLocaleTimeString('he-IL', {hour:'2-digit', minute:'2-digit'});
                list.innerHTML += `
                    <div class="meal-card">
                        <div>
                            <div style="font-weight:bold; font-size:1.1rem;">${m.name}</div>
                            <div style="color:#94a3b8; font-size:0.85rem;">${time}</div>
                        </div>
                        <div class="d-flex align-items-center gap-3">
                            <span style="color:var(--neon-green); font-weight:bold;">${m.calories} קל'</span>
                            <i class="bi bi-trash text-danger" style="cursor:pointer" onclick="deleteMeal(${m.id})"></i>
                        </div>
                    </div>`;
            });
        } catch(e) {}
    }

    async function addMeal() {
        const name = document.getElementById('foodName');
        const cal = document.getElementById('foodCal');
        if(!name.value || !cal.value) return;
        const localTime = (new Date(new Date() - new Date().getTimezoneOffset() * 60000)).toISOString().slice(0, -1);
        try {
            await fetch(`${API_URL}/meals`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ name: name.value, calories: parseInt(cal.value), date: localTime, userId: currentUser.id }) });
            name.value = ''; cal.value = ''; loadData();
        } catch(e) {}
    }

    async function deleteMeal(id) {
        if(!confirm('למחוק?')) return;
        await fetch(`${API_URL}/meals/${id}`, { method: 'DELETE' });
        loadData();
    }
    init();
</script>
</body>
</html>
