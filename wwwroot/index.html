<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מערכת הדיאטה שלי</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
    <style>
        body { background-color: #f3f4f6; font-family: 'Segoe UI', sans-serif; }
        .main-card { max-width: 600px; margin: 20px auto; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); border: none; overflow: hidden; }
        /* שינוי: רקע ירוק במקום כחול */
        .header { background: linear-gradient(135deg, #10b981, #059669); color: white; padding: 40px 20px; text-align: center; }
        .calories-circle { width: 140px; height: 140px; border-radius: 50%; background: white; color: #059669; display: flex; flex-direction: column; align-items: center; justify-content: center; margin: -70px auto 20px; border: 6px solid #ecfdf5; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .cal-number { font-size: 36px; font-weight: 800; line-height: 1; }
        .cal-label { font-size: 14px; color: #6b7280; }
        .list-group-item { border-left: none; border-right: none; padding: 15px; transition: 0.2s; }
        .list-group-item:hover { background-color: #f9fafb; }
        .delete-btn { color: #ef4444; cursor: pointer; opacity: 0.6; transition: 0.2s; padding: 5px; }
        .delete-btn:hover { opacity: 1; transform: scale(1.1); }
    </style>
</head>
<body>

<div class="card main-card">
    <div class="header">
        <h2 class="mb-0">🍏 יומן בריאות</h2>
        <p class="opacity-75">צעד קטן בכל יום</p>
    </div>
    
    <div class="card-body p-4 pt-0">
        <div class="calories-circle">
            <span class="cal-number" id="calDisplay">0</span>
            <span class="cal-label">קלוריות היום</span>
        </div>

        <div class="input-group mb-4 shadow-sm">
            <input type="text" id="foodName" class="form-control border-0 bg-light" placeholder="מה אכלת?">
            <input type="number" id="calories" class="form-control border-0 bg-light" placeholder="קל'" style="max-width: 80px;">
            <button class="btn btn-success" onclick="addMeal()">הוסף +</button>
        </div>

        <h6 class="text-muted mb-3 border-bottom pb-2">ארוחות היום</h6>
        <div id="mealsList" class="list-group list-group-flush">
            <div class="text-center text-muted py-3">טוען נתונים...</div>
        </div>
    </div>
</div>

<script>
    const API_URL = '/api';

    async function loadStats() {
        try {
            const res = await fetch(`${API_URL}/stats`);
            if (!res.ok) console.error("Stats Error:", res.status);
            const data = await res.json();
            document.getElementById('calDisplay').innerText = data.dailyCalories || 0;
        } catch (e) {
            console.error("Failed to load stats:", e);
        }
    }

    async function loadMeals() {
        const list = document.getElementById('mealsList');
        try {
            const res = await fetch(`${API_URL}/meals`);
            
            if (!res.ok) {
                list.innerHTML = '<div class="text-center text-danger">שגיאה בטעינת הנתונים</div>';
                return;
            }

            const meals = await res.json();
            console.log("Meals loaded:", meals); // זה יעזור לנו לבדוק מה מגיע

            list.innerHTML = ''; // ניקוי הרשימה

            if (meals.length === 0) {
                list.innerHTML = '<div class="text-center text-muted py-3">עדיין לא נרשמו ארוחות היום. זה הזמן להוסיף! 🥗</div>';
                return;
            }
            
            meals.forEach(m => {
                // בדיקה שהשמות תואמים (גדולה/קטנה)
                const name = m.name || m.Name || "ללא שם";
                const calories = m.calories || m.Calories || 0;
                const id = m.id || m.Id;
                
                const time = new Date(m.date || m.Date).toLocaleTimeString('he-IL', {hour: '2-digit', minute:'2-digit'});
                
                list.innerHTML += `
                    <div class="list-group-item d-flex justify-content-between align-items-center">
                        <div>
                            <div class="fw-bold text-dark">${name}</div>
                            <small class="text-muted" style="font-size: 0.8em">🕒 ${time}</small>
                        </div>
                        <div class="d-flex align-items-center gap-3">
                            <span class="badge bg-light text-dark border">${calories} קל'</span>
                            <i class="bi bi-trash delete-btn" onclick="deleteMeal(${id})" title="מחק"></i>
                        </div>
                    </div>`;
            });
        } catch (e) {
            console.error(e);
            list.innerHTML = '<div class="text-center text-danger">שגיאת תקשורת עם השרת</div>';
        }
    }

    async function addMeal() {
        const nameInput = document.getElementById('foodName');
        const calInput = document.getElementById('calories');
        const btn = document.querySelector('button');

        if(!nameInput.value || !calInput.value) {
            alert('נא למלא שם וקלוריות');
            return;
        }

        btn.disabled = true;
        btn.innerText = 'שומר...';

        try {
            const res = await fetch(`${API_URL}/meals`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ name: nameInput.value, calories: parseInt(calInput.value) })
            });
            
            if (res.ok) {
                nameInput.value = '';
                calInput.value = '';
                await loadStats(); 
                await loadMeals();
            } else {
                alert('שגיאה בשמירה');
            }
        } catch (e) {
            alert('שגיאה בשמירה');
        } finally {
            btn.disabled = false;
            btn.innerText = 'הוסף +';
        }
    }

    async function deleteMeal(id) {
        if(!confirm('למחוק את הארוחה?')) return;
        try {
            await fetch(`${API_URL}/meals/${id}`, { method: 'DELETE' });
            loadStats(); 
            loadMeals();
        } catch (e) {
            alert('שגיאה במחיקה');
        }
    }

    // הפעלה ראשונית
    loadStats(); 
    loadMeals();
</script>
</body>
</html>
