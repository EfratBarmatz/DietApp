<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Diet App Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.75);
            --glass-border: rgba(255, 255, 255, 0.5);
            --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
            --primary-grad: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --accent-color: #764ba2;
        }

        /* --- רקע מונפש --- */
        body {
            font-family: 'Rubik', sans-serif;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            margin: 0;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* בועות מרחפות ברקע */
        .circles {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            overflow: hidden; z-index: -1;
        }
        .circles li {
            position: absolute; display: block; list-style: none;
            width: 20px; height: 20px; background: rgba(255, 255, 255, 0.2);
            animation: animate 25s linear infinite; bottom: -150px;
            border-radius: 50%;
        }
        .circles li:nth-child(1) { left: 25%; width: 80px; height: 80px; animation-delay: 0s; }
        .circles li:nth-child(2) { left: 10%; width: 20px; height: 20px; animation-delay: 2s; animation-duration: 12s; }
        .circles li:nth-child(3) { left: 70%; width: 20px; height: 20px; animation-delay: 4s; }
        .circles li:nth-child(4) { left: 40%; width: 60px; height: 60px; animation-delay: 0s; animation-duration: 18s; }
        .circles li:nth-child(5) { left: 65%; width: 20px; height: 20px; animation-delay: 0s; }
        
        @keyframes animate {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; border-radius: 0; }
            100% { transform: translateY(-1000px) rotate(720deg); opacity: 0; border-radius: 50%; }
        }

        /* --- כרטיס הזכוכית --- */
        .app-container {
            width: 100%; max-width: 480px; padding: 20px;
            position: relative; z-index: 10;
        }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-radius: 24px;
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            padding: 30px;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp { from { transform: translateY(50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        /* --- אלמנטים --- */
        h1, h2 { color: #2d3748; font-weight: 800; }
        .subtitle { color: #718096; font-size: 0.95rem; margin-bottom: 25px; }

        .form-control {
            background: rgba(255, 255, 255, 0.6);
            border: 2px solid transparent;
            border-radius: 15px;
            padding: 15px;
            font-size: 1rem;
            transition: 0.3s;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
        }
        .form-control:focus {
            background: white; border-color: #a78bfa;
            box-shadow: 0 0 0 4px rgba(167, 139, 250, 0.2);
            transform: translateY(-2px);
        }

        .btn-wow {
            background: var(--primary-grad);
            border: none; border-radius: 15px;
            color: white; padding: 15px;
            font-weight: 700; font-size: 1.1rem;
            letter-spacing: 0.5px;
            box-shadow: 0 10px 20px -10px rgba(118, 75, 162, 0.5);
            transition: 0.3s; width: 100%;
        }
        .btn-wow:hover { transform: translateY(-3px); box-shadow: 0 15px 30px -10px rgba(118, 75, 162, 0.7); }
        .btn-wow:active { transform: scale(0.98); }

        /* --- קלוריות --- */
        .cal-display {
            background: white;
            border-radius: 50%;
            width: 160px; height: 160px;
            margin: 0 auto 30px;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            position: relative;
        }
        .cal-display::before {
            content: ''; position: absolute;
            top: -5px; left: -5px; right: -5px; bottom: -5px;
            border-radius: 50%;
            background: var(--primary-grad);
            z-index: -1; opacity: 0.3; filter: blur(10px);
        }
        .cal-number { font-size: 3.5rem; font-weight: 800; background: var(--primary-grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; line-height: 1; }
        
        /* --- רשימת ארוחות --- */
        .meal-item {
            background: white;
            border-radius: 16px;
            padding: 15px 20px;
            margin-bottom: 12px;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            transition: 0.3s;
            border-left: 5px solid transparent;
            animation: fadeIn 0.4s ease-out;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }
        
        .meal-item:hover { transform: translateX(5px); border-left-color: var(--accent-color); }
        
        .badge-cal { background: #f3e8ff; color: #7e22ce; padding: 5px 12px; border-radius: 20px; font-weight: 700; font-size: 0.85rem; }

        .error-msg { background: #fee2e2; color: #b91c1c; padding: 12px; border-radius: 12px; font-size: 0.9rem; margin-bottom: 20px; display: none; border-right: 4px solid #b91c1c; }
        
        .hidden { display: none !important; }
        .link-text { cursor: pointer; color: #5b21b6; font-weight: 600; text-decoration: underline; }
    </style>
</head>
<body>

<ul class="circles"><li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li></ul>

<div class="app-container">
    
    <div id="loginScreen" class="glass-card">
        <div class="text-center mb-4">
            <h1>ברוכים הבאים 🍎</h1>
            <p class="subtitle">המסע שלך לאורח חיים בריא מתחיל כאן</p>
        </div>
        
        <div id="loginError" class="error-msg"></div>

        <div class="mb-3">
            <input type="email" id="loginEmail" class="form-control" placeholder="המייל שלך..." dir="ltr">
        </div>
        <div class="mb-4">
            <input type="password" id="loginPass" class="form-control" placeholder="הסיסמה הסודית..." dir="ltr">
        </div>
        <button onclick="login()" class="btn-wow mb-3">כניסה למערכת</button>
        <div class="text-center mt-3">
            <span class="text-muted">חדש כאן?</span>
            <span onclick="showRegister()" class="link-text">צור חשבון בחינם</span>
        </div>
    </div>

    <div id="registerScreen" class="glass-card hidden">
        <div class="text-center mb-4">
            <h1>יצירת חשבון ✨</h1>
            <p class="subtitle">הצטרפו לקהילה הבריאה שלנו</p>
        </div>
        
        <div id="regError" class="error-msg"></div>

        <div class="mb-3">
            <input type="email" id="regEmail" class="form-control" placeholder="אימייל" dir="ltr">
        </div>
        <div class="mb-4">
            <input type="password" id="regPass" class="form-control" placeholder="סיסמה (8+ תווים)" dir="ltr">
        </div>
        <button onclick="register()" class="btn-wow mb-3">הרשמה מהירה</button>
        <div class="text-center mt-3">
            <span onclick="showLogin()" class="link-text">כבר רשום? התחבר</span>
        </div>
    </div>

    <div id="appScreen" class="glass-card hidden" style="padding: 20px;">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h5 class="m-0 fw-bold text-muted">היומן שלי</h5>
            <button onclick="logout()" class="btn btn-sm btn-outline-danger" style="border-radius: 10px;">יציאה</button>
        </div>

        <div class="cal-display">
            <span id="totalCalories" class="cal-number">0</span>
            <span class="text-muted small">קלוריות היום</span>
        </div>

        <div class="d-flex gap-2 mb-4">
            <input type="text" id="foodName" class="form-control" placeholder="מה אכלת?" style="flex: 2;">
            <input type="number" id="foodCal" class="form-control" placeholder="קל'" style="flex: 1;">
            <button onclick="addMeal()" class="btn-wow" style="width: auto; padding: 0 20px;">+</button>
        </div>

        <div id="mealsList" style="max-height: 400px; overflow-y: auto; padding: 5px;">
